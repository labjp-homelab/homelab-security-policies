apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: wkl-001-require-ro-rootfs
  title: WKL-001 · Raíz de solo lectura
  description: Si no se puede escribir en la raíz del contenedor, un atacante no puede
    dejar binarios ni modificar el código que se ejecuta. Lo escribible va a un emptyDir
    aparte.
  annotations:
    security.labjp.xyz/rule-id: WKL-001
    security.labjp.xyz/category: workloads
    security.labjp.xyz/severity: medium
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: require-ro-rootfs
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: variables.allContainers.all(container, has(container.securityContext)
      && has(container.securityContext.readOnlyRootFilesystem) && container.securityContext.readOnlyRootFilesystem
      == true)
    security.labjp.xyz/remediation: "securityContext:\n  readOnlyRootFilesystem: true\n\
      volumeMounts:\n  - name: tmp\n    mountPath: /tmp"
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/workloads/validatingpolicy-wkl-001-require-ro-rootfs.yaml
