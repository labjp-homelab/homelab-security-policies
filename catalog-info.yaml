apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: rbac-001-restrict-binding-clusteradmin
  title: RBAC-001 · Sin enlaces a cluster-admin
  description: cluster-admin permite cualquier acción sobre cualquier recurso. Ninguna
    aplicación ni agente debe tenerlo; cada uno, su Role mínimo.
  annotations:
    security.labjp.xyz/rule-id: RBAC-001
    security.labjp.xyz/category: rbac
