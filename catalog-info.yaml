apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: pod-102-require-run-as-non-root-user
  title: POD-102 · Ningún uid 0 explícito
  description: 'runAsUser: 0 fuerza root aunque la imagen declare otro usuario.'
  annotations:
    security.labjp.xyz/rule-id: POD-102
    security.labjp.xyz/category: pod-security-restricted
    security.labjp.xyz/severity: high
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: require-run-as-non-root-user
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: 'object.spec.?securityContext.?runAsUser.orValue(1)
      > 0

      variables.allContainers.all(container, container.?securityContext.?runAsUser.orValue(1)
      > 0)'
    security.labjp.xyz/remediation: "securityContext:\n  runAsUser: 1000   # cualquier\
      \ uid distinto de 0"
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/restricted/validatingpolicy-pod-102-require-run-as-non-root-user.yaml
