    security.labjp.xyz/kyverno-policy: disallow-privilege-escalation
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: variables.allContainers.all(container, container.?securityContext.allowPrivilegeEscalation.orValue(true)
      == false)
    security.labjp.xyz/remediation: "securityContext:\n  allowPrivilegeEscalation:\
      \ false"
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/restricted/validatingpolicy-pod-103-disallow-privilege-escalation.yaml
