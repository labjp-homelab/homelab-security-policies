apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: pod-101-require-run-as-nonroot
  title: POD-101 · Los contenedores no corren como root
  description: 'Con runAsNonRoot el kubelet se niega a arrancar una imagen que corra
    como root: un proceso con uid 0 está a una vulnerabilidad del kernel de ser root
    en el nodo.'
  annotations:
    security.labjp.xyz/rule-id: POD-101
    security.labjp.xyz/category: pod-security-restricted
    security.labjp.xyz/severity: high
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: require-run-as-nonroot
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: (object.spec.?securityContext.?runAsNonRoot.orValue(false)
      == true && variables.ctnrs.all(c, c.?securityContext.?runAsNonRoot.orValue(true)
      == true)) || variables.ctnrs.all(c, c.?securityContext.?runAsNonRoot.orValue(false)
      == true)
    security.labjp.xyz/remediation: "securityContext:\n  runAsNonRoot: true"
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/restricted/validatingpolicy-pod-101-require-run-as-nonroot.yaml
