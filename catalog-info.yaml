apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: pod-104-disallow-capabilities-strict
  title: POD-104 · Sin capabilities (salvo NET_BIND_SERVICE)
  description: 'Se quitan todas las capabilities y como mucho se añade NET_BIND_SERVICE:
    el runtime concede por defecto otras (NET_RAW, CHOWN) que casi ninguna aplicación
    necesita.'
  annotations:
    security.labjp.xyz/rule-id: POD-104
    security.labjp.xyz/category: pod-security-restricted
    security.labjp.xyz/severity: medium
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: disallow-capabilities-strict
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: 'variables.allContainers.all(container, container.?securityContext.?capabilities.?drop.orValue([]).exists_one(capability,
      capability == ''ALL''))

      variables.allContainers.all(container, container.?securityContext.?capabilities.?add.orValue([]).size()
      == 0 || (container.securityContext.capabilities.add.orValue([]).size() == 1
      && container.securityContext.capabilities.add[0] == ''NET_BIND_SERVICE''))'
    security.labjp.xyz/remediation: "securityContext:\n  capabilities:\n    drop:\
      \ [\"ALL\"]"
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/restricted/validatingpolicy-pod-104-disallow-capabilities-strict.yaml
  tags:
  - security-policy
  - pod-security-restricted
  - medium
  links:
  - url: /docs/default/resource/security-guidelines/pod-security-restricted/pod-104/
    title: Lineamiento
