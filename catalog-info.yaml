apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: pod-010-restrict-sysctls
  title: POD-010 · Solo sysctls seguros
  description: Los sysctls fuera del conjunto seguro cambian parámetros del kernel
    que afectan a todos los pods del nodo.
  annotations:
    security.labjp.xyz/rule-id: POD-010
    security.labjp.xyz/category: pod-security-baseline
    security.labjp.xyz/severity: medium
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: restrict-sysctls
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: object.spec.?securityContext.?sysctls.orValue([]).all(sysctl,
      sysctl.?name.orValue('') in variables.allowedSysctls)
    security.labjp.xyz/remediation: '# Solo: kernel.shm_rmid_forced, net.ipv4.ip_local_port_range,

      # net.ipv4.ip_unprivileged_port_start, net.ipv4.tcp_syncookies, net.ipv4.ping_group_range'
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/baseline/validatingpolicy-pod-010-restrict-sysctls.yaml
