apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: wkl-003-disallow-default-namespace
  title: WKL-003 · Nada en el namespace default
  description: 'El namespace default no tiene cuotas, límites ni NetworkPolicies propias:
    lo que cae ahí queda fuera de la gobernanza.'
