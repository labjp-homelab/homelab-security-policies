# GENERADO por tools/generate_guidelines.py desde policies/. No editar a mano.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: security-guidelines
  title: Lineamientos de seguridad
  description: 'Estándar de seguridad del homelab: políticas de Kyverno, fuente única
    de los lineamientos.'
  annotations:
    backstage.io/techdocs-ref: dir:.
  tags:
  - security
  - kyverno
  - guidelines
  links:
  - url: https://github.com/labjp-homelab/homelab-security-policies
    title: Repo (fuente de verdad)
spec:
  type: security-guidelines
  owner: plataforma
  system: platform
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: img-001-disallow-latest-tag
  title: IMG-001 · Sin el tag latest
  description: 'latest puede apuntar mañana a otra imagen: lo que se revisó y firmó
    no es necesariamente lo que corre.'
  annotations:
    security.labjp.xyz/rule-id: IMG-001
    security.labjp.xyz/category: images
    security.labjp.xyz/severity: high
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: disallow-latest-tag
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: 'object.spec.containers.all(container, container.image.contains('':''))

      object.spec.containers.all(container, !container.image.endsWith('':latest''))'
    security.labjp.xyz/remediation: 'image: ghcr.io/labjp-homelab/app:1.4.2'
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/images/validatingpolicy-img-001-disallow-latest-tag.yaml
  tags:
  - security-policy
  - images
  - high
  links:
  - url: /docs/default/resource/security-guidelines/images/img-001/
    title: Lineamiento
  - url: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/images/validatingpolicy-img-001-disallow-latest-tag.yaml
    title: Política (Imágenes y cadena de suministro)
spec:
  type: security-policy
  owner: plataforma
  system: platform
  dependencyOf:
  - resource:security-guidelines
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: img-002-require-image-checksum
  title: IMG-002 · Imagen fijada por digest
  description: 'Solo el digest es inmutable: con él, la firma y el SBOM describen
    exactamente lo desplegado (lección del compromiso de Trivy de marzo de 2026, que
    reemplazó tags).'
  annotations:
    security.labjp.xyz/rule-id: IMG-002
    security.labjp.xyz/category: images
    security.labjp.xyz/severity: medium
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: require-image-checksum
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: object.spec.containers.all(container, container.image.contains('@'))
    security.labjp.xyz/remediation: 'image: ghcr.io/labjp-homelab/app:1.4.2@sha256:<digest>'
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/images/validatingpolicy-img-002-require-image-checksum.yaml
  tags:
  - security-policy
  - images
  - medium
  links:
  - url: /docs/default/resource/security-guidelines/images/img-002/
    title: Lineamiento
  - url: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/images/validatingpolicy-img-002-require-image-checksum.yaml
    title: Política (Imágenes y cadena de suministro)
spec:
  type: security-policy
  owner: plataforma
  system: platform
  dependencyOf:
  - resource:security-guidelines
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: img-003-restrict-image-registries
  title: IMG-003 · Solo registries conocidos
  description: Las imágenes de registries desconocidos pueden no estar escaneadas
    ni firmadas. La lista sale del inventario real del clúster (3 oct 2026); las imágenes
    sin registry son de Docker Hub.
  annotations:
    security.labjp.xyz/rule-id: IMG-003
    security.labjp.xyz/category: images
    security.labjp.xyz/severity: medium
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: restrict-image-registries
    security.labjp.xyz/applies-to: pods, pods/ephemeralcontainers
    security.labjp.xyz/conditions: 'variables.allContainers.all(c, (c.image.split(''/'')[0].contains(''.'')
      || c.image.split(''/'')[0].contains('':'') ? c.image.split(''/'')[0] : ''docker.io'')
      in variables.allowedRegistries)'
    security.labjp.xyz/remediation: '# Usar un registry de la lista; para uno nuevo,
      añadirlo aquí con su motivo'
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/images/validatingpolicy-img-003-restrict-image-registries.yaml
  tags:
  - security-policy
  - images
  - medium
  links:
  - url: /docs/default/resource/security-guidelines/images/img-003/
    title: Lineamiento
  - url: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/images/validatingpolicy-img-003-restrict-image-registries.yaml
    title: Política (Imágenes y cadena de suministro)
spec:
  type: security-policy
  owner: plataforma
  system: platform
  dependencyOf:
  - resource:security-guidelines
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: net-001-restrict-nodeport
  title: NET-001 · Sin Services NodePort
  description: Un NodePort abre un puerto en todos los nodos y se salta el Gateway
    y su TLS. En el homelab se publica por Envoy Gateway o por MetalLB.
  annotations:
    security.labjp.xyz/rule-id: NET-001
    security.labjp.xyz/category: network
    security.labjp.xyz/severity: medium
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: restrict-nodeport
    security.labjp.xyz/applies-to: services
    security.labjp.xyz/conditions: object.spec.type != 'NodePort'
    security.labjp.xyz/remediation: "spec:\n  type: ClusterIP   # y una HTTPRoute\
      \ en el Gateway"
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/network/validatingpolicy-net-001-restrict-nodeport.yaml
  tags:
  - security-policy
  - network
  - medium
  links:
  - url: /docs/default/resource/security-guidelines/network/net-001/
    title: Lineamiento
  - url: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/network/validatingpolicy-net-001-restrict-nodeport.yaml
    title: Política (Red y exposición de servicios)
spec:
  type: security-policy
  owner: plataforma
  system: platform
  dependencyOf:
  - resource:security-guidelines
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: net-002-restrict-external-ips
  title: NET-002 · Sin externalIPs en Services
  description: externalIPs permite interceptar tráfico hacia cualquier IP (CVE-2020-8554).
  annotations:
    security.labjp.xyz/rule-id: NET-002
    security.labjp.xyz/category: network
    security.labjp.xyz/severity: high
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: restrict-external-ips
    security.labjp.xyz/applies-to: services
    security.labjp.xyz/conditions: '!has(object.spec.externalIPs) || size(object.spec.externalIPs)
      == 0'
    security.labjp.xyz/remediation: '# No declarar spec.externalIPs'
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/network/validatingpolicy-net-002-restrict-external-ips.yaml
  tags:
  - security-policy
  - network
  - high
  links:
  - url: /docs/default/resource/security-guidelines/network/net-002/
    title: Lineamiento
  - url: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/network/validatingpolicy-net-002-restrict-external-ips.yaml
    title: Política (Red y exposición de servicios)
spec:
  type: security-policy
  owner: plataforma
  system: platform
  dependencyOf:
  - resource:security-guidelines
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: net-003-no-localhost-service
  title: NET-003 · Sin Services ExternalName a localhost
  description: Un ExternalName hacia localhost hace que el proxy del clúster apunte
    a servicios locales del nodo.
  annotations:
    security.labjp.xyz/rule-id: NET-003
    security.labjp.xyz/category: network
    security.labjp.xyz/severity: medium
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: no-localhost-service
    security.labjp.xyz/applies-to: services
    security.labjp.xyz/conditions: object.spec.type != 'ExternalName' || object.spec.externalName
      != 'localhost'
    security.labjp.xyz/remediation: '# No usar type: ExternalName con externalName:
      localhost'
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/network/validatingpolicy-net-003-no-localhost-service.yaml
  tags:
  - security-policy
  - network
  - medium
  links:
  - url: /docs/default/resource/security-guidelines/network/net-003/
    title: Lineamiento
  - url: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/network/validatingpolicy-net-003-no-localhost-service.yaml
    title: Política (Red y exposición de servicios)
spec:
  type: security-policy
  owner: plataforma
  system: platform
  dependencyOf:
  - resource:security-guidelines
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: pod-001-disallow-privileged-containers
  title: POD-001 · Sin contenedores privilegiados
  description: 'Un contenedor privilegiado tiene casi los mismos permisos que un proceso
    del nodo: puede ver sus dispositivos y escapar del aislamiento sin necesidad de
    un exploit.'
  annotations:
    security.labjp.xyz/rule-id: POD-001
    security.labjp.xyz/category: pod-security-baseline
    security.labjp.xyz/severity: high
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: disallow-privileged-containers
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: variables.allContainers.all(container, container.?securityContext.?privileged.orValue(false)
      == false)
    security.labjp.xyz/remediation: "securityContext:\n  privileged: false   # o simplemente\
      \ no declararlo"
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/baseline/validatingpolicy-pod-001-disallow-privileged-containers.yaml
  tags:
  - security-policy
  - pod-security-baseline
  - high
  links:
  - url: /docs/default/resource/security-guidelines/pod-security-baseline/pod-001/
    title: Lineamiento
  - url: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/baseline/validatingpolicy-pod-001-disallow-privileged-containers.yaml
    title: Política (Seguridad de pods · Baseline)
spec:
  type: security-policy
  owner: plataforma
  system: platform
  dependencyOf:
  - resource:security-guidelines
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: pod-002-disallow-host-namespaces
  title: POD-002 · Sin namespaces del nodo
  description: 'Con hostNetwork, hostPID o hostIPC el pod comparte la red, los procesos
    o la memoria compartida del nodo: puede espiar tráfico, ver procesos de otros
    pods o atacarlos.'
  annotations:
    security.labjp.xyz/rule-id: POD-002
    security.labjp.xyz/category: pod-security-baseline
    security.labjp.xyz/severity: high
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: disallow-host-namespaces
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: '!(variables.hostNetwork || variables.hostIPC ||
      variables.hostPID)'
    security.labjp.xyz/remediation: "spec:\n  hostNetwork: false\n  hostPID: false\n\
      \  hostIPC: false"
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/baseline/validatingpolicy-pod-002-disallow-host-namespaces.yaml
  tags:
  - security-policy
  - pod-security-baseline
  - high
  links:
  - url: /docs/default/resource/security-guidelines/pod-security-baseline/pod-002/
    title: Lineamiento
  - url: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/baseline/validatingpolicy-pod-002-disallow-host-namespaces.yaml
    title: Política (Seguridad de pods · Baseline)
spec:
  type: security-policy
  owner: plataforma
  system: platform
  dependencyOf:
  - resource:security-guidelines
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: pod-003-disallow-host-path
  title: POD-003 · Sin volúmenes hostPath
  description: 'Un hostPath monta un directorio del nodo dentro del contenedor: con
    la ruta adecuada (el socket del runtime, /etc, /var/lib/kubelet) el contenedor
    controla el nodo.'
  annotations:
    security.labjp.xyz/rule-id: POD-003
    security.labjp.xyz/category: pod-security-baseline
    security.labjp.xyz/severity: high
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: disallow-host-path
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: object.spec.?volumes.orValue([]).all(volume, !has(volume.hostPath))
    security.labjp.xyz/remediation: "volumes:\n  - name: data\n    persistentVolumeClaim:\
      \     # o emptyDir para datos temporales\n      claimName: data"
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/baseline/validatingpolicy-pod-003-disallow-host-path.yaml
  tags:
  - security-policy
  - pod-security-baseline
  - high
  links:
  - url: /docs/default/resource/security-guidelines/pod-security-baseline/pod-003/
    title: Lineamiento
  - url: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/baseline/validatingpolicy-pod-003-disallow-host-path.yaml
    title: Política (Seguridad de pods · Baseline)
spec:
  type: security-policy
  owner: plataforma
  system: platform
  dependencyOf:
  - resource:security-guidelines
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: pod-004-disallow-host-ports
  title: POD-004 · Sin puertos del nodo
  description: hostPort publica el contenedor directamente en la IP del nodo, saltándose
    Services, NetworkPolicies y el Gateway.
  annotations:
    security.labjp.xyz/rule-id: POD-004
    security.labjp.xyz/category: pod-security-baseline
    security.labjp.xyz/severity: medium
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: disallow-host-ports
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: variables.allContainers.all(container, container.?ports.orValue([]).all(port,
      port.?hostPort.orValue(0) == 0))
    security.labjp.xyz/remediation: "ports:\n  - containerPort: 8080   # sin hostPort;\
      \ exponer con un Service"
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/baseline/validatingpolicy-pod-004-disallow-host-ports.yaml
  tags:
  - security-policy
  - pod-security-baseline
  - medium
  links:
  - url: /docs/default/resource/security-guidelines/pod-security-baseline/pod-004/
    title: Lineamiento
  - url: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/baseline/validatingpolicy-pod-004-disallow-host-ports.yaml
    title: Política (Seguridad de pods · Baseline)
spec:
  type: security-policy
  owner: plataforma
  system: platform
  dependencyOf:
  - resource:security-guidelines
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: pod-005-disallow-host-process
  title: POD-005 · Sin HostProcess de Windows
  description: Un contenedor HostProcess de Windows corre directamente en el nodo,
    sin aislamiento.
  annotations:
    security.labjp.xyz/rule-id: POD-005
    security.labjp.xyz/category: pod-security-baseline
    security.labjp.xyz/severity: high
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: disallow-host-process
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: variables.allContainers.all(container, container.?securityContext.?windowsOptions.?hostProcess.orValue(false)
      == false)
    security.labjp.xyz/remediation: "securityContext:\n  windowsOptions:\n    hostProcess:\
      \ false"
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/baseline/validatingpolicy-pod-005-disallow-host-process.yaml
  tags:
  - security-policy
  - pod-security-baseline
  - high
  links:
  - url: /docs/default/resource/security-guidelines/pod-security-baseline/pod-005/
    title: Lineamiento
  - url: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/baseline/validatingpolicy-pod-005-disallow-host-process.yaml
    title: Política (Seguridad de pods · Baseline)
spec:
  type: security-policy
  owner: plataforma
  system: platform
  dependencyOf:
  - resource:security-guidelines
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: pod-006-disallow-capabilities
  title: POD-006 · Solo capabilities del conjunto Baseline
  description: Capabilities como SYS_ADMIN o NET_ADMIN dan poderes de root sobre el
    kernel o la red del nodo. Solo se admiten las del conjunto por defecto de Baseline.
  annotations:
    security.labjp.xyz/rule-id: POD-006
    security.labjp.xyz/category: pod-security-baseline
    security.labjp.xyz/severity: high
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: disallow-capabilities
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: variables.allContainers.all(container, container.?securityContext.?capabilities.?add.orValue([]).all(capability,
      capability == '' || capability in variables.allowedCapabilities))
    security.labjp.xyz/remediation: "securityContext:\n  capabilities:\n    drop:\
      \ [\"ALL\"]\n    add: [\"NET_BIND_SERVICE\"]   # solo si de verdad hace falta"
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/baseline/validatingpolicy-pod-006-disallow-capabilities.yaml
  tags:
  - security-policy
  - pod-security-baseline
  - high
  links:
  - url: /docs/default/resource/security-guidelines/pod-security-baseline/pod-006/
    title: Lineamiento
  - url: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/baseline/validatingpolicy-pod-006-disallow-capabilities.yaml
    title: Política (Seguridad de pods · Baseline)
spec:
  type: security-policy
  owner: plataforma
  system: platform
  dependencyOf:
  - resource:security-guidelines
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: pod-007-disallow-proc-mount
  title: POD-007 · /proc con máscara por defecto
  description: procMount Unmasked expone rutas de /proc que el runtime oculta y que
    revelan información del nodo o permiten modificarlo.
  annotations:
    security.labjp.xyz/rule-id: POD-007
    security.labjp.xyz/category: pod-security-baseline
    security.labjp.xyz/severity: medium
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: disallow-proc-mount
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: variables.allContainers.all(container, container.?securityContext.?procMount.orValue('Default')
      == 'Default')
    security.labjp.xyz/remediation: "securityContext:\n  procMount: Default   # o\
      \ no declararlo"
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/baseline/validatingpolicy-pod-007-disallow-proc-mount.yaml
