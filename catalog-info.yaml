apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: sec-001-secrets-not-from-env-vars
  title: SEC-001 · Secretos montados, no en variables de entorno
  description: Las variables de entorno acaban en logs, volcados de error y en el
    entorno de los procesos hijos. Un secreto montado como archivo se expone menos.
  annotations:
    security.labjp.xyz/rule-id: SEC-001
    security.labjp.xyz/category: secrets
    security.labjp.xyz/severity: medium
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: secrets-not-from-env-vars
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: 'object.spec.containers.all(container, container.?env.orValue([]).all(env,
      !has(env.valueFrom) || !has(env.valueFrom.secretKeyRef)))

      object.spec.containers.all(container, container.?envFrom.orValue([]).all(envFrom,
      !has(envFrom.secretRef)))'
    security.labjp.xyz/remediation: "volumes:\n  - name: creds\n    secret:\n    \
      \  secretName: app-creds"
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/secrets/validatingpolicy-sec-001-secrets-not-from-env-vars.yaml
