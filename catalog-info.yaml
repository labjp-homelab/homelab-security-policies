apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: wkl-002-require-requests-limits
  title: WKL-002 · Requests y límite de memoria
  description: Sin requests el planificador reparte a ciegas, y sin límite de memoria
    un contenedor puede agotar el nodo y provocar el desalojo de otros servicios.
  annotations:
    security.labjp.xyz/rule-id: WKL-002
    security.labjp.xyz/category: workloads
    security.labjp.xyz/severity: medium
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: require-requests-limits
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: variables.allContainers.all(c, has(c.resources)
      && has(c.resources.requests) && has(c.resources.requests.memory) && c.resources.requests.memory
      != '' && has(c.resources.requests.cpu) && c.resources.requests.cpu != '' &&
      has(c.resources.limits) && has(c.resources.limits.memory) && c.resources.limits.memory
      != '')
    security.labjp.xyz/remediation: "resources:\n  requests:\n    cpu: 50m\n    memory:\
      \ 64Mi\n  limits:\n    memory: 256Mi"
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/workloads/validatingpolicy-wkl-002-require-requests-limits.yaml
  tags:
  - security-policy
  - workloads
  - medium
  links:
  - url: /docs/default/resource/security-guidelines/workloads/wkl-002/
    title: Lineamiento
  - url: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/workloads/validatingpolicy-wkl-002-require-requests-limits.yaml
    title: Política (Cargas de trabajo)
spec:
  type: security-policy
  owner: plataforma
  system: platform
  dependencyOf:
  - resource:security-guidelines
