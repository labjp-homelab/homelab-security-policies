apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: pod-105-restrict-seccomp-strict
  title: POD-105 · seccomp RuntimeDefault o Localhost
  description: Solo perfiles seccomp que filtran syscalls. La política de Kyverno
    acepta el valor sin declarar; aquí se recomienda declararlo siempre para no depender
    del nodo.
  annotations:
    security.labjp.xyz/rule-id: POD-105
    security.labjp.xyz/category: pod-security-restricted
    security.labjp.xyz/severity: medium
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: restrict-seccomp-strict
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: object.spec.?securityContext.?seccompProfile.?type.orValue('RuntimeDefault')
      in ['RuntimeDefault', 'Localhost'] && variables.allContainers.all(container,
      container.?securityContext.?seccompProfile.?type.orValue('RuntimeDefault') in
      ['RuntimeDefault', 'Localhost'])
    security.labjp.xyz/remediation: "securityContext:\n  seccompProfile:\n    type:\
      \ RuntimeDefault"
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/restricted/validatingpolicy-pod-105-restrict-seccomp-strict.yaml
