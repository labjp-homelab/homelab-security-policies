apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: pod-106-restrict-volume-types
  title: POD-106 · Solo tipos de volumen seguros
  description: 'Solo configMap, csi, downwardAPI, emptyDir, ephemeral, persistentVolumeClaim,
    projected y secret: el resto puede montar recursos del nodo o de la red sin control.'
  annotations:
    security.labjp.xyz/rule-id: POD-106
    security.labjp.xyz/category: pod-security-restricted
    security.labjp.xyz/severity: medium
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: restrict-volume-types
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: '!has(object.spec.volumes) || object.spec.volumes.all(vol,
      has(vol.configMap) || has(vol.csi) || has(vol.downwardAPI) || has(vol.emptyDir)
      || has(vol.ephemeral) || has(vol.persistentVolumeClaim) || has(vol.projected)
      || has(vol.secret))'
    security.labjp.xyz/remediation: "volumes:\n  - name: tmp\n    emptyDir: {}"
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/restricted/validatingpolicy-pod-106-restrict-volume-types.yaml
  tags:
