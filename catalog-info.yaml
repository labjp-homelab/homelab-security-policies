    security.labjp.xyz/conditions: object.roleRef.name != 'cluster-admin'
    security.labjp.xyz/remediation: "roleRef:\n  kind: ClusterRole\n  name: <rol mínimo\
      \ propio>   # nunca cluster-admin"
