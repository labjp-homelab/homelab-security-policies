apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: pod-008-disallow-selinux
  title: POD-008 · Sin opciones SELinux personalizadas
  description: Cambiar el usuario, rol o tipo SELinux puede quitar al contenedor el
    confinamiento que le aplica el runtime.
  annotations:
    security.labjp.xyz/rule-id: POD-008
    security.labjp.xyz/category: pod-security-baseline
    security.labjp.xyz/severity: medium
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: disallow-selinux
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: 'variables.hasValidSELinuxType && variables.allContainerTypes.all(container,
      container.?securityContext.?seLinuxOptions.?type.orValue('''') == '''' || variables.seLinuxTypes.exists(type,
      type == container.securityContext.seLinuxOptions.type))

      variables.hasValidSELinuxUserRole && variables.allContainerTypes.all(container,
      container.?securityContext.?seLinuxOptions.?user.orValue('''') == '''' && container.?securityContext.?seLinuxOptions.?role.orValue('''')
      == '''')'
    security.labjp.xyz/remediation: '# No declarar seLinuxOptions, o solo el tipo
      container_t / container_init_t / container_kvm_t'
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/baseline/validatingpolicy-pod-008-disallow-selinux.yaml
  tags:
  - security-policy
  - pod-security-baseline
  - medium
  links:
  - url: /docs/default/resource/security-guidelines/pod-security-baseline/pod-008/
    title: Lineamiento
  - url: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/pod-security/baseline/validatingpolicy-pod-008-disallow-selinux.yaml
    title: Política (Seguridad de pods · Baseline)
spec:
  type: security-policy
  owner: plataforma
  system: platform
  dependencyOf:
  - resource:security-guidelines
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: pod-009-restrict-seccomp
  title: POD-009 · Perfil seccomp no deshabilitado
  description: seccomp Unconfined deja al contenedor invocar cualquier syscall del
    kernel, incluidas las que usan los exploits de escape.
  annotations:
    security.labjp.xyz/rule-id: POD-009
    security.labjp.xyz/category: pod-security-baseline
    security.labjp.xyz/severity: medium
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: restrict-seccomp
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: variables.hasValidSeccompProfile && variables.allContainers.all(container,
      container.?securityContext.?seccompProfile.?type.orValue('Localhost') in variables.allowedProfileTypes)
    security.labjp.xyz/remediation: "securityContext:\n  seccompProfile:\n    type:\
      \ RuntimeDefault"
