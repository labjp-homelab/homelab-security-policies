apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: rbac-002-restrict-binding-system-groups
  title: RBAC-002 · Sin enlaces a grupos del sistema
  description: Enlazar system:anonymous, system:unauthenticated o system:masters da
    permisos a cualquiera o el control total.
  annotations:
    security.labjp.xyz/rule-id: RBAC-002
    security.labjp.xyz/category: rbac
    security.labjp.xyz/severity: high
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: restrict-binding-system-groups
    security.labjp.xyz/applies-to: clusterrolebindings, rolebindings
    security.labjp.xyz/conditions: 'object.subjects.all(subject, subject.name != ''system:anonymous'')

      object.subjects.all(subject, subject.name != ''system:unauthenticated'')

      object.subjects.all(subject, subject.name != ''system:masters'')'
    security.labjp.xyz/remediation: "subjects:\n  - kind: ServiceAccount   # o un\
      \ grupo propio de Keycloak\n    name: <identidad concreta>"
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/rbac/validatingpolicy-rbac-002-restrict-binding-system-groups.yaml
