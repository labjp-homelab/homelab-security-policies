apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: rbac-003-restrict-escalation-verbs-roles
  title: RBAC-003 · Sin verbos de escalada en roles
  description: bind, escalate e impersonate sobre roles permiten darse a uno mismo
    cualquier permiso.
  annotations:
    security.labjp.xyz/rule-id: RBAC-003
    security.labjp.xyz/category: rbac
    security.labjp.xyz/severity: high
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: restrict-escalation-verbs-roles
    security.labjp.xyz/applies-to: clusterroles, roles
    security.labjp.xyz/conditions: object.rules == null || !object.rules.exists(rule,
      rule.apiGroups.exists(apiGroup, apiGroup in variables.apiGroups) && rule.resources.exists(resource,
      resource in variables.resources) && rule.verbs.exists(verb, verb in variables.verbs))
    security.labjp.xyz/remediation: "rules:\n  - apiGroups: [\"\"]\n    resources:\
      \ [pods]\n    verbs: [get, list, watch]   # nada de bind / escalate / impersonate\
      \ / *"
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/rbac/validatingpolicy-rbac-003-restrict-escalation-verbs-roles.yaml
