apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: wkl-004-disallow-container-sock-mounts
  title: WKL-004 · Sin el socket del runtime
  description: 'Montar el socket de containerd, CRI-O o Docker equivale a ser root
    en el nodo: permite lanzar contenedores privilegiados.'
  annotations:
    security.labjp.xyz/rule-id: WKL-004
    security.labjp.xyz/category: workloads
    security.labjp.xyz/severity: high
    security.labjp.xyz/mode: Audit
    security.labjp.xyz/kyverno-policy: disallow-container-sock-mounts
    security.labjp.xyz/applies-to: pods
    security.labjp.xyz/conditions: 'variables.hasVolumes || variables.volumesWithHostPath.all(volume,
      !volume.hostPath.path.matches(''/var/run/docker.sock''))

      variables.hasVolumes || variables.volumesWithHostPath.all(volume, !volume.hostPath.path.matches(''/var/run/containerd/containerd.sock''))

      variables.hasVolumes || variables.volumesWithHostPath.all(volume, !volume.hostPath.path.matches(''/var/run/crio/crio.sock''))

      variables.hasVolumes || variables.volumesWithHostPath.all(volume, !volume.hostPath.path.matches(''/var/run/cri-dockerd.sock''))'
    security.labjp.xyz/remediation: '# No montar /var/run/containerd/containerd.sock
      ni equivalentes'
    security.labjp.xyz/source: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/workloads/validatingpolicy-wkl-004-disallow-container-sock-mounts.yaml
  tags:
  - security-policy
  - workloads
  - high
  links:
  - url: /docs/default/resource/security-guidelines/workloads/wkl-004/
    title: Lineamiento
  - url: https://github.com/labjp-homelab/homelab-security-policies/blob/main/policies/workloads/validatingpolicy-wkl-004-disallow-container-sock-mounts.yaml
    title: Política (Cargas de trabajo)
spec:
  type: security-policy
  owner: plataforma
  system: platform
  dependencyOf:
  - resource:security-guidelines
