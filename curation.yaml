# Curaduría del estándar: QUÉ políticas oficiales de Kyverno adoptamos y lo que les añadimos.
#
# Las políticas vienen de la biblioteca oficial (github.com/kyverno/policies, Apache-2.0),
# fijada a un commit. Su lógica (CEL) no se toca, salvo donde se indica `override` (p. ej.
# la lista de registries, que la biblioteca deja para personalizar). Encima, cada regla
# lleva nuestro ID estable, título y por qué en español, cómo cumplirla y sus casos de
# prueba. `tools/vendor_policies.py` combina ambas cosas y escribe policies/ y tests/.
#
# IDs por categoría: POD-0xx (baseline) y POD-1xx (restricted) de Pod Security Standards,
# WKL cargas, IMG imágenes, NET red, RBAC permisos, SEC secretos. Un ID no se reutiliza.
upstream:
  repo: https://github.com/kyverno/policies
  ref: ec478cb5996376c0d2f09520675805a8e33297c9

categories:
  - id: pod-security-baseline
    dir: pod-security/baseline
    title: Seguridad de pods · Baseline
    summary: >-
      Pod Security Standards nivel Baseline: impide las escaladas de privilegios conocidas
      (contenedores privilegiados, namespaces y rutas del nodo).
  - id: pod-security-restricted
    dir: pod-security/restricted
    title: Seguridad de pods · Restricted
    summary: >-
      Pod Security Standards nivel Restricted: endurecimiento de pods según las buenas
      prácticas actuales (sin root, sin capabilities, seccomp, volúmenes acotados).
  - id: workloads
    dir: workloads
    title: Cargas de trabajo
    summary: Recursos, sistema de archivos y ubicación de las cargas.
  - id: images
    dir: images
    title: Imágenes y cadena de suministro
    summary: De dónde vienen las imágenes y cómo se fijan.
  - id: network
    dir: network
    title: Red y exposición de servicios
    summary: Cómo se exponen los servicios fuera del clúster.
  - id: rbac
    dir: rbac
    title: Permisos (RBAC)
    summary: Quién puede hacer qué en el clúster.
  - id: secrets
    dir: secrets
    title: Secretos
    summary: Cómo llegan los secretos a las cargas.

rules:
  # --- Pod Security Standards · Baseline --------------------------------------------
  - id: POD-001
    category: pod-security-baseline
    upstream: pod-security-vpol/baseline/disallow-privileged-containers/disallow-privileged-containers.yaml
    severity: high
    title: Sin contenedores privilegiados
    rationale: >-
      Un contenedor privilegiado tiene casi los mismos permisos que un proceso del nodo:
      puede ver sus dispositivos y escapar del aislamiento sin necesidad de un exploit.
    remediation: |
      securityContext:
        privileged: false   # o simplemente no declararlo
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}
  - id: POD-002
    category: pod-security-baseline
    upstream: pod-security-vpol/baseline/disallow-host-namespaces/disallow-host-namespaces.yaml
    severity: high
    title: Sin namespaces del nodo
    rationale: >-
      Con hostNetwork, hostPID o hostIPC el pod comparte la red, los procesos o la memoria
      compartida del nodo: puede espiar tráfico, ver procesos de otros pods o atacarlos.
    remediation: |
      spec:
        hostNetwork: false
        hostPID: false
        hostIPC: false
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}
  - id: POD-003
    category: pod-security-baseline
    upstream: pod-security-vpol/baseline/disallow-host-path/disallow-host-path.yaml
    severity: high
    title: Sin volúmenes hostPath
    rationale: >-
      Un hostPath monta un directorio del nodo dentro del contenedor: con la ruta adecuada
      (el socket del runtime, /etc, /var/lib/kubelet) el contenedor controla el nodo.
    remediation: |
      volumes:
        - name: data
          persistentVolumeClaim:     # o emptyDir para datos temporales
            claimName: data
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}
  - id: POD-004
    category: pod-security-baseline
    upstream: pod-security-vpol/baseline/disallow-host-ports/disallow-host-ports.yaml
    severity: medium
    title: Sin puertos del nodo
    rationale: >-
      hostPort publica el contenedor directamente en la IP del nodo, saltándose Services,
      NetworkPolicies y el Gateway.
    remediation: |
      ports:
        - containerPort: 8080   # sin hostPort; exponer con un Service
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}
  - id: POD-005
    category: pod-security-baseline
    upstream: pod-security-vpol/baseline/disallow-host-process/disallow-host-process.yaml
    severity: high
    title: Sin HostProcess de Windows
    rationale: >-
      Un contenedor HostProcess de Windows corre directamente en el nodo, sin aislamiento.
    remediation: |
      securityContext:
        windowsOptions:
          hostProcess: false
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}
  - id: POD-006
    category: pod-security-baseline
    upstream: pod-security-vpol/baseline/disallow-capabilities/disallow-capabilities.yaml
    severity: high
    title: Solo capabilities del conjunto Baseline
    rationale: >-
      Capabilities como SYS_ADMIN o NET_ADMIN dan poderes de root sobre el kernel o la red
      del nodo. Solo se admiten las del conjunto por defecto de Baseline.
    remediation: |
      securityContext:
        capabilities:
          drop: ["ALL"]
          add: ["NET_BIND_SERVICE"]   # solo si de verdad hace falta
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}
  - id: POD-007
    category: pod-security-baseline
    upstream: pod-security-vpol/baseline/disallow-proc-mount/disallow-proc-mount.yaml
    severity: medium
    title: /proc con máscara por defecto
    rationale: >-
      procMount Unmasked expone rutas de /proc que el runtime oculta y que revelan
      información del nodo o permiten modificarlo.
    remediation: |
      securityContext:
        procMount: Default   # o no declararlo
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}
  - id: POD-008
    category: pod-security-baseline
    upstream: pod-security-vpol/baseline/disallow-selinux/disallow-selinux.yaml
    severity: medium
    title: Sin opciones SELinux personalizadas
    rationale: >-
      Cambiar el usuario, rol o tipo SELinux puede quitar al contenedor el confinamiento
      que le aplica el runtime.
    remediation: |
      # No declarar seLinuxOptions, o solo el tipo container_t / container_init_t / container_kvm_t
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}
  - id: POD-009
    category: pod-security-baseline
    upstream: pod-security-vpol/baseline/restrict-seccomp/restrict-seccomp.yaml
    severity: medium
    title: Perfil seccomp no deshabilitado
    rationale: >-
      seccomp Unconfined deja al contenedor invocar cualquier syscall del kernel, incluidas
      las que usan los exploits de escape.
    remediation: |
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}
  - id: POD-010
    category: pod-security-baseline
    upstream: pod-security-vpol/baseline/restrict-sysctls/restrict-sysctls.yaml
    severity: medium
    title: Solo sysctls seguros
    rationale: >-
      Los sysctls fuera del conjunto seguro cambian parámetros del kernel que afectan a
      todos los pods del nodo.
    remediation: |
      # Solo: kernel.shm_rmid_forced, net.ipv4.ip_local_port_range,
      # net.ipv4.ip_unprivileged_port_start, net.ipv4.tcp_syncookies, net.ipv4.ping_group_range
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}

  # --- Pod Security Standards · Restricted -------------------------------------------
  - id: POD-101
    category: pod-security-restricted
    upstream: pod-security-vpol/restricted/require-run-as-nonroot/require-run-as-nonroot.yaml
    severity: high
    title: Los contenedores no corren como root
    rationale: >-
      Con runAsNonRoot el kubelet se niega a arrancar una imagen que corra como root: un
      proceso con uid 0 está a una vulnerabilidad del kernel de ser root en el nodo.
    remediation: |
      securityContext:
        runAsNonRoot: true
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}
  - id: POD-102
    category: pod-security-restricted
    upstream: pod-security-vpol/restricted/require-run-as-non-root-user/require-run-as-non-root-user.yaml
    severity: high
    title: Ningún uid 0 explícito
    rationale: >-
      runAsUser: 0 fuerza root aunque la imagen declare otro usuario.
    remediation: |
      securityContext:
        runAsUser: 1000   # cualquier uid distinto de 0
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}
  - id: POD-103
    category: pod-security-restricted
    upstream: pod-security-vpol/restricted/disallow-privilege-escalation/disallow-privilege-escalation.yaml
    severity: high
    title: Sin escalada de privilegios
    rationale: >-
      Con allowPrivilegeEscalation (verdadero por defecto) un binario setuid puede dar al
      proceso más privilegios que su padre. Debe declararse false.
    remediation: |
      securityContext:
        allowPrivilegeEscalation: false
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}
  - id: POD-104
    category: pod-security-restricted
    upstream: pod-security-vpol/restricted/disallow-capabilities-strict/disallow-capabilities-strict.yaml
    severity: medium
    title: Sin capabilities (salvo NET_BIND_SERVICE)
    rationale: >-
      Se quitan todas las capabilities y como mucho se añade NET_BIND_SERVICE: el runtime
      concede por defecto otras (NET_RAW, CHOWN) que casi ninguna aplicación necesita.
    remediation: |
      securityContext:
        capabilities:
          drop: ["ALL"]
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}
  - id: POD-105
    category: pod-security-restricted
    upstream: pod-security-vpol/restricted/restrict-seccomp-strict/restrict-seccomp-strict.yaml
    severity: medium
    title: seccomp RuntimeDefault o Localhost
    rationale: >-
      Solo perfiles seccomp que filtran syscalls. La política de Kyverno acepta el valor sin
      declarar; aquí se recomienda declararlo siempre para no depender del nodo.
    remediation: |
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}
  - id: POD-106
    category: pod-security-restricted
    upstream: pod-security-vpol/restricted/restrict-volume-types/restrict-volume-types.yaml
    severity: medium
    title: Solo tipos de volumen seguros
    rationale: >-
      Solo configMap, csi, downwardAPI, emptyDir, ephemeral, persistentVolumeClaim, projected
      y secret: el resto puede montar recursos del nodo o de la red sin control.
    remediation: |
      volumes:
        - name: tmp
          emptyDir: {}
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}

  # --- Cargas de trabajo -------------------------------------------------------------
  - id: WKL-001
    category: workloads
    upstream: best-practices-vpol/require-ro-rootfs/require-ro-rootfs.yaml
    severity: medium
    title: Raíz de solo lectura
    rationale: >-
      Si no se puede escribir en la raíz del contenedor, un atacante no puede dejar binarios
      ni modificar el código que se ejecuta. Lo escribible va a un emptyDir aparte.
    remediation: |
      securityContext:
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: tmp
          mountPath: /tmp
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}
  - id: WKL-002
    category: workloads
    upstream: best-practices-vpol/require-pod-requests-limits/require-pod-requests-limits.yaml
    severity: medium
    title: Requests y límite de memoria
    rationale: >-
      Sin requests el planificador reparte a ciegas, y sin límite de memoria un contenedor
      puede agotar el nodo y provocar el desalojo de otros servicios.
    remediation: |
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}
  - id: WKL-003
    category: workloads
    upstream: best-practices-vpol/disallow-default-namespace/disallow-default-namespace.yaml
    severity: low
    title: Nada en el namespace default
    rationale: >-
      El namespace default no tiene cuotas, límites ni NetworkPolicies propias: lo que cae
      ahí queda fuera de la gobernanza.
    remediation: |
      metadata:
        namespace: <namespace propio, declarado en la gobernanza>
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}
  - id: WKL-004
    category: workloads
    upstream: best-practices-vpol/disallow-cri-sock-mount/disallow-cri-sock-mount.yaml
    severity: high
    title: Sin el socket del runtime
    rationale: >-
      Montar el socket de containerd, CRI-O o Docker equivale a ser root en el nodo: permite
      lanzar contenedores privilegiados.
    remediation: |
      # No montar /var/run/containerd/containerd.sock ni equivalentes
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}

  # --- Imágenes y cadena de suministro ------------------------------------------------
  - id: IMG-001
    category: images
    upstream: best-practices-vpol/disallow-latest-tag/disallow-latest-tag.yaml
    severity: high
    title: Sin el tag latest
    rationale: >-
      latest puede apuntar mañana a otra imagen: lo que se revisó y firmó no es
      necesariamente lo que corre.
    remediation: |
      image: ghcr.io/labjp-homelab/app:1.4.2
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}
  - id: IMG-002
    category: images
    upstream: other-vpol/require-image-checksum/require-image-checksum.yaml
    severity: medium
    title: Imagen fijada por digest
    rationale: >-
      Solo el digest es inmutable: con él, la firma y el SBOM describen exactamente lo
      desplegado (lección del compromiso de Trivy de marzo de 2026, que reemplazó tags).
    remediation: |
      image: ghcr.io/labjp-homelab/app:1.4.2@sha256:<digest>
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}
  - id: IMG-003
    category: images
    upstream: best-practices-vpol/restrict-image-registries/restrict-image-registries.yaml
    severity: medium
    title: Solo registries conocidos
    rationale: >-
      Las imágenes de registries desconocidos pueden no estar escaneadas ni firmadas. La
      lista sale del inventario real del clúster (3 oct 2026); las imágenes sin registry son
      de Docker Hub.
    remediation: |
      # Usar un registry de la lista; para uno nuevo, añadirlo aquí con su motivo
    override:
      variables:
        - name: allContainers
          expression: >-
            object.spec.containers + object.spec.?initContainers.orValue([]) +
            object.spec.?ephemeralContainers.orValue([])
        - name: allowedRegistries
          expression: >-
            ['ghcr.io', 'quay.io', 'docker.io', 'index.docker.io', 'registry.k8s.io',
            'reg.kyverno.io', 'nvcr.io', 'gcr.io', 'cr.agentgateway.dev',
            'registry.access.redhat.com', 'registry.redhat.io', 'public.ecr.aws', 'cgr.dev',
            'registry.labjp.xyz']
      validations:
        - expression: >-
            variables.allContainers.all(c, (c.image.split('/')[0].contains('.') ||
            c.image.split('/')[0].contains(':') ? c.image.split('/')[0] : 'docker.io')
            in variables.allowedRegistries)
          message: La imagen viene de un registry que no está en la lista permitida.
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}

  # --- Red ----------------------------------------------------------------------------
  - id: NET-001
    category: network
    upstream: best-practices-vpol/restrict-node-port/restrict-node-port.yaml
    severity: medium
    title: Sin Services NodePort
    rationale: >-
      Un NodePort abre un puerto en todos los nodos y se salta el Gateway y su TLS. En el
      homelab se publica por Envoy Gateway o por MetalLB.
    remediation: |
      spec:
        type: ClusterIP   # y una HTTPRoute en el Gateway
    tests: {pass: [service-compliant], fail: [service-noncompliant]}
  - id: NET-002
    category: network
    upstream: best-practices-vpol/restrict-service-external-ips/restrict-service-external-ips.yaml
    severity: high
    title: Sin externalIPs en Services
    rationale: >-
      externalIPs permite interceptar tráfico hacia cualquier IP (CVE-2020-8554).
    remediation: |
      # No declarar spec.externalIPs
    tests: {pass: [service-compliant], fail: [service-noncompliant]}
  - id: NET-003
    category: network
    upstream: other-vpol/disallow-localhost-services/disallow-localhost-services.yaml
    severity: medium
    title: Sin Services ExternalName a localhost
    rationale: >-
      Un ExternalName hacia localhost hace que el proxy del clúster apunte a servicios
      locales del nodo.
    remediation: |
      # No usar type: ExternalName con externalName: localhost
    tests: {pass: [service-compliant], fail: [service-localhost]}

  # --- Permisos (RBAC) ------------------------------------------------------------------
  - id: RBAC-001
    category: rbac
    upstream: other-vpol/restrict-binding-clusteradmin/restrict-binding-clusteradmin.yaml
    severity: high
    title: Sin enlaces a cluster-admin
    rationale: >-
      cluster-admin permite cualquier acción sobre cualquier recurso. Ninguna aplicación ni
      agente debe tenerlo; cada uno, su Role mínimo.
    remediation: |
      roleRef:
        kind: ClusterRole
        name: <rol mínimo propio>   # nunca cluster-admin
    tests: {pass: [binding-compliant], fail: [binding-cluster-admin]}
  - id: RBAC-002
    category: rbac
    upstream: other-vpol/restrict-binding-system-groups/restrict-binding-system-groups.yaml
    severity: high
    title: Sin enlaces a grupos del sistema
    rationale: >-
      Enlazar system:anonymous, system:unauthenticated o system:masters da permisos a
      cualquiera o el control total.
    remediation: |
      subjects:
        - kind: ServiceAccount   # o un grupo propio de Keycloak
          name: <identidad concreta>
    tests: {pass: [binding-compliant], fail: [binding-anonymous]}
  - id: RBAC-003
    category: rbac
    upstream: other-vpol/restrict-escalation-verbs-roles/restrict-escalation-verbs-roles.yaml
    severity: high
    title: Sin verbos de escalada en roles
    rationale: >-
      bind, escalate e impersonate sobre roles permiten darse a uno mismo cualquier permiso.
    remediation: |
      rules:
        - apiGroups: [""]
          resources: [pods]
          verbs: [get, list, watch]   # nada de bind / escalate / impersonate / *
    tests: {pass: [role-compliant], fail: [role-escalate]}
  - id: RBAC-004
    category: rbac
    upstream: other-vpol/restrict-clusterrole-nodesproxy/restrict-clusterrole-nodesproxy.yaml
    severity: high
    title: Sin acceso a nodes/proxy
    rationale: >-
      nodes/proxy da acceso directo a la API del kubelet: ejecutar comandos en cualquier pod
      del nodo saltándose la auditoría del API server.
    remediation: |
      # Quitar "nodes/proxy" de los resources del ClusterRole
    tests: {pass: [clusterrole-compliant], fail: [clusterrole-nodes-proxy]}

  # --- Secretos ---------------------------------------------------------------------------
  - id: SEC-001
    category: secrets
    upstream: other-vpol/disallow-secrets-from-env-vars/disallow-secrets-from-env-vars.yaml
    severity: medium
    title: Secretos montados, no en variables de entorno
    rationale: >-
      Las variables de entorno acaban en logs, volcados de error y en el entorno de los
      procesos hijos. Un secreto montado como archivo se expone menos.
    remediation: |
      volumes:
        - name: creds
          secret:
            secretName: app-creds
    tests: {pass: [pod-compliant], fail: [pod-noncompliant]}
  - id: SEC-002
    category: secrets
    upstream: other-vpol/deny-secret-service-account-token-type/deny-secret-service-account-token-type.yaml
    severity: medium
    # Solo en la admisión: el escaneo de fondo exigiría dar a Kyverno lectura de todos los
    # Secrets del clúster, demasiado riesgo para una regla en Audit.
    background: false
    title: Sin tokens de ServiceAccount de larga vida
    rationale: >-
      Un Secret de tipo service-account-token no caduca. Los pods deben usar tokens
      proyectados, que caducan y se rotan solos.
    remediation: |
      # Usar el token proyectado (automountServiceAccountToken) o TokenRequest
    tests: {pass: [secret-compliant], fail: [secret-sa-token]}
