# K8S-001 · Los contenedores no corren como root.
# Estándar de seguridad del homelab: estas anotaciones son la fuente de los lineamientos
# que publica Backstage (ver README.md).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: run-as-non-root
  labels:
    security.labjp.xyz/standard: homelab-baseline
  annotations:
    security.labjp.xyz/rule-id: K8S-001
    policies.kyverno.io/title: Los contenedores no corren como root
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Un proceso con uid 0 dentro del contenedor está a una vulnerabilidad del kernel o a un montaje mal puesto de ser root en el nodo. Exigir runAsNonRoot hace que el kubelet se niegue a arrancar una imagen que corra como root.
    security.labjp.xyz/remediation: |
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000   # o el uid sin privilegios que defina la imagen
spec:
  # Audit: informa en los PolicyReports sin bloquear. Se pasa a Deny por namespace cuando
  # su informe está limpio (backlog E1.2).
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c, c.?securityContext.?runAsNonRoot.orValue(object.spec.?securityContext.?runAsNonRoot.orValue(false)) == true)
      messageExpression: >-
        '[K8S-001] ' + variables.containers.filter(c, !(c.?securityContext.?runAsNonRoot.orValue(object.spec.?securityContext.?runAsNonRoot.orValue(false)) == true)).map(c, c.name).join(', ') +
        ' no fija runAsNonRoot: true (ni en el pod ni en el contenedor).'
