# K8S-002 · Sin escalada de privilegios.
# Estándar de seguridad del homelab: estas anotaciones son la fuente de los lineamientos
# que publica Backstage (ver README.md).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privilege-escalation
  labels:
    security.labjp.xyz/standard: homelab-baseline
  annotations:
    security.labjp.xyz/rule-id: K8S-002
    policies.kyverno.io/title: Sin escalada de privilegios
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Con allowPrivilegeEscalation (verdadero por defecto) un binario setuid o una capability heredada puede dar al proceso más privilegios que su padre. Debe declararse false de forma explícita.
    security.labjp.xyz/remediation: |
      securityContext:
        allowPrivilegeEscalation: false
spec:
  # Audit: informa en los PolicyReports sin bloquear. Se pasa a Deny por namespace cuando
  # su informe está limpio (backlog E1.2).
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c, c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)
      messageExpression: >-
        '[K8S-002] ' + variables.containers.filter(c, !(c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)).map(c, c.name).join(', ') +
        ' no declara allowPrivilegeEscalation: false.'
