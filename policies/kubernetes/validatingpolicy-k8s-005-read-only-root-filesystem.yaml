# K8S-005 · Sistema de archivos raíz de solo lectura.
# Estándar de seguridad del homelab: estas anotaciones son la fuente de los lineamientos
# que publica Backstage (ver README.md).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: read-only-root-filesystem
  labels:
    security.labjp.xyz/standard: homelab-baseline
  annotations:
    security.labjp.xyz/rule-id: K8S-005
    policies.kyverno.io/title: Sistema de archivos raíz de solo lectura
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Si el atacante no puede escribir en la raíz del contenedor, no puede dejar binarios ni modificar el código que se ejecuta. Lo que la aplicación necesite escribir va a un emptyDir montado aparte.
    security.labjp.xyz/remediation: |
      securityContext:
        readOnlyRootFilesystem: true
      # y lo escribible, aparte:
      volumeMounts:
        - name: tmp
          mountPath: /tmp
spec:
  # Audit: informa en los PolicyReports sin bloquear. Se pasa a Deny por namespace cuando
  # su informe está limpio (backlog E1.2).
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c, c.?securityContext.?readOnlyRootFilesystem.orValue(false) == true)
      messageExpression: >-
        '[K8S-005] ' + variables.containers.filter(c, !(c.?securityContext.?readOnlyRootFilesystem.orValue(false) == true)).map(c, c.name).join(', ') +
        ' no declara readOnlyRootFilesystem: true.'
