# K8S-006 · Límite de memoria declarado.
# Estándar de seguridad del homelab: estas anotaciones son la fuente de los lineamientos
# que publica Backstage (ver README.md).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-memory-limits
  labels:
    security.labjp.xyz/standard: homelab-baseline
  annotations:
    security.labjp.xyz/rule-id: K8S-006
    policies.kyverno.io/title: Límite de memoria declarado
    policies.kyverno.io/category: Recursos
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Un contenedor sin límite de memoria puede agotar el nodo y provocar que el kubelet desaloje a otros servicios: es una denegación de servicio que no necesita ninguna vulnerabilidad.
    security.labjp.xyz/remediation: |
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 256Mi
spec:
  # Audit: informa en los PolicyReports sin bloquear. Se pasa a Deny por namespace cuando
  # su informe está limpio (backlog E1.2).
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c, c.?resources.?limits.?memory.orValue('') != '')
      messageExpression: >-
        '[K8S-006] ' + variables.containers.filter(c, !(c.?resources.?limits.?memory.orValue('') != '')).map(c, c.name).join(', ') +
        ' no declara resources.limits.memory.'
