# K8S-007 · Imagen fijada, sin latest.
# Estándar de seguridad del homelab: estas anotaciones son la fuente de los lineamientos
# que publica Backstage (ver README.md).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: pin-image-reference
  labels:
    security.labjp.xyz/standard: homelab-baseline
  annotations:
    security.labjp.xyz/rule-id: K8S-007
    policies.kyverno.io/title: Imagen fijada, sin latest
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Un tag como latest puede apuntar mañana a otra imagen: lo que se revisó y firmó no es necesariamente lo que corre. Se fija por digest (o, como mínimo, por un tag de versión), y así la firma y el SBOM describen exactamente lo desplegado.
    security.labjp.xyz/remediation: |
      image: registry.example/app:1.4.2@sha256:<digest>
spec:
  # Audit: informa en los PolicyReports sin bloquear. Se pasa a Deny por namespace cuando
  # su informe está limpio (backlog E1.2).
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c, c.image.contains('@sha256:') || (c.image.substring(c.image.lastIndexOf('/') + 1).contains(':') && !c.image.endsWith(':latest')))
      messageExpression: >-
        '[K8S-007] ' + variables.containers.filter(c, !(c.image.contains('@sha256:') || (c.image.substring(c.image.lastIndexOf('/') + 1).contains(':') && !c.image.endsWith(':latest')))).map(c, c.name).join(', ') +
        ' usa latest o una imagen sin tag ni digest.'
