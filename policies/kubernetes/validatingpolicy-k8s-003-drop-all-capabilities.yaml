# K8S-003 · Sin capabilities de Linux.
# Estándar de seguridad del homelab: estas anotaciones son la fuente de los lineamientos
# que publica Backstage (ver README.md).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: drop-all-capabilities
  labels:
    security.labjp.xyz/standard: homelab-baseline
  annotations:
    security.labjp.xyz/rule-id: K8S-003
    policies.kyverno.io/title: Sin capabilities de Linux
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      El runtime concede por defecto capabilities como NET_RAW o CHOWN que casi ninguna aplicación necesita y que facilitan ataques en la red del nodo. Se quitan todas y se añade solo la imprescindible, justificada.
    security.labjp.xyz/remediation: |
      securityContext:
        capabilities:
          drop: ["ALL"]
spec:
  # Audit: informa en los PolicyReports sin bloquear. Se pasa a Deny por namespace cuando
  # su informe está limpio (backlog E1.2).
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c, 'ALL' in c.?securityContext.?capabilities.?drop.orValue([]))
      messageExpression: >-
        '[K8S-003] ' + variables.containers.filter(c, !('ALL' in c.?securityContext.?capabilities.?drop.orValue([]))).map(c, c.name).join(', ') +
        ' no quita todas las capabilities (drop: [ALL]).'
