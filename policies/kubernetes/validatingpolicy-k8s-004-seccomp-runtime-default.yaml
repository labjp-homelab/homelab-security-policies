# K8S-004 · Perfil seccomp del runtime.
# Estándar de seguridad del homelab: estas anotaciones son la fuente de los lineamientos
# que publica Backstage (ver README.md).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: seccomp-runtime-default
  labels:
    security.labjp.xyz/standard: homelab-baseline
  annotations:
    security.labjp.xyz/rule-id: K8S-004
    policies.kyverno.io/title: Perfil seccomp del runtime
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Sin perfil seccomp el contenedor puede invocar cualquier syscall del kernel, incluidas las que usan muchos exploits de escape. RuntimeDefault bloquea las peligrosas sin romper aplicaciones normales.
    security.labjp.xyz/remediation: |
      securityContext:
        seccompProfile:
          type: RuntimeDefault
spec:
  # Audit: informa en los PolicyReports sin bloquear. Se pasa a Deny por namespace cuando
  # su informe está limpio (backlog E1.2).
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c, c.?securityContext.?seccompProfile.?type.orValue(object.spec.?securityContext.?seccompProfile.?type.orValue('')) in ['RuntimeDefault', 'Localhost'])
      messageExpression: >-
        '[K8S-004] ' + variables.containers.filter(c, !(c.?securityContext.?seccompProfile.?type.orValue(object.spec.?securityContext.?seccompProfile.?type.orValue('')) in ['RuntimeDefault', 'Localhost'])).map(c, c.name).join(', ') +
        ' no usa un perfil seccomp RuntimeDefault o Localhost.'
