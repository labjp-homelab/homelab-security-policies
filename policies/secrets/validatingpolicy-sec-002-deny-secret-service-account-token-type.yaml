# SEC-002 · Sin tokens de ServiceAccount de larga vida
# Origen: kyverno/policies@ec478cb59963 other-vpol/deny-secret-service-account-token-type/deny-secret-service-account-token-type.yaml (Apache-2.0).
# Lógica de Kyverno sin cambios; añadidos: ID, categoría, textos, marcos de referencia, modo Audit.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: deny-secret-service-account-token-type
  annotations:
    policies.kyverno.io/title: Deny Secret Service Account Token Type in ValidatingPolicy
    policies.kyverno.io/category: Security in vpol
    kyverno.io/kubernetes-version: '1.30'
    kyverno.io/kyverno-version: 1.14.0
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Secret, ServiceAccount
    policies.kyverno.io/description: Before version 1.24, Kubernetes automatically generated Secret-based
      tokens  for ServiceAccounts. When creating a Secret, you can specify its type using the  type field
      of the Secret resource . The type kubernetes.io/service-account-token is used for legacy ServiceAccount
      tokens . These legacy Tokens can be of security concern and should be audited.
    security.labjp.xyz/rule-id: SEC-002
    security.labjp.xyz/title: Sin tokens de ServiceAccount de larga vida
    security.labjp.xyz/rationale: Un Secret de tipo service-account-token no caduca. Los pods deben usar
      tokens proyectados, que caducan y se rotan solos.
    security.labjp.xyz/remediation: |
      # Usar el token proyectado (automountServiceAccountToken) o TokenRequest
    security.labjp.xyz/upstream: https://github.com/kyverno/policies/blob/ec478cb5996376c0d2f09520675805a8e33297c9/other-vpol/deny-secret-service-account-token-type/deny-secret-service-account-token-type.yaml
    security.labjp.xyz/owasp-k8s-2025: K03
    security.labjp.xyz/owasp-mcp-2025: MCP01
    security.labjp.xyz/pci-dss-4.0.1: '8'
  labels:
    security.labjp.xyz/standard: homelab-baseline
    security.labjp.xyz/category: secrets
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - secrets
  validations:
  - expression: object.type != 'kubernetes.io/service-account-token'
    message: '[SEC-002] Secret ServiceAccount token type is not allowed.'
