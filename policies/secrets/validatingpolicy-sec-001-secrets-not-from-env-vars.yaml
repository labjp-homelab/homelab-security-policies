# GENERADO por tools/vendor_policies.py desde curation/rules.yaml. No editar a mano.
# SEC-001 · Secretos montados, no en variables de entorno
# Origen: kyverno/policies@ec478cb59963 other-vpol/disallow-secrets-from-env-vars/disallow-secrets-from-env-vars.yaml (Apache-2.0).
# Lógica de Kyverno sin cambios; añadidos: ID, categoría, textos, marcos de referencia, modo Audit.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: secrets-not-from-env-vars
  annotations:
    policies.kyverno.io/title: Disallow Secrets from Env Vars in ValidatingPolicy
    policies.kyverno.io/category: Sample, EKS Best Practices in vpol
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod, Secret
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: '1.30'
    policies.kyverno.io/description: Secrets used as environment variables containing sensitive information
      may, if not carefully controlled,  be printed in log output which could be visible to unauthorized
      people and captured in forwarding applications. This policy disallows using Secrets as environment
      variables.
    security.labjp.xyz/rule-id: SEC-001
    security.labjp.xyz/title: Secretos montados, no en variables de entorno
    security.labjp.xyz/rationale: Las variables de entorno acaban en logs, volcados de error y en el entorno
      de los procesos hijos. Un secreto montado como archivo se expone menos.
    security.labjp.xyz/remediation: |
      volumes:
        - name: creds
          secret:
            secretName: app-creds
    security.labjp.xyz/origin: kyverno-library
    security.labjp.xyz/upstream: https://github.com/kyverno/policies/blob/ec478cb5996376c0d2f09520675805a8e33297c9/other-vpol/disallow-secrets-from-env-vars/disallow-secrets-from-env-vars.yaml
    security.labjp.xyz/owasp-k8s-2025: K03
    security.labjp.xyz/owasp-mcp-2025: MCP01
    security.labjp.xyz/pci-dss-4.0.1: '3'
  labels:
    security.labjp.xyz/standard: homelab-baseline
    security.labjp.xyz/category: secrets
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: "object.spec.containers.all(container,  container.?env.orValue([]).all(env, \n  !has(env.valueFrom)\
      \ || !has(env.valueFrom.secretKeyRef)))"
    message: '[SEC-001] Secrets must be mounted as volumes, not as environment variables.'
  - expression: object.spec.containers.all(container,  container.?envFrom.orValue([]).all(envFrom, !has(envFrom.secretRef)))
    message: '[SEC-001] Secrets must not come from envFrom statements.'
