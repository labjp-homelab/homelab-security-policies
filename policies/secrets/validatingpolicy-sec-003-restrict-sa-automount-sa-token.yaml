# GENERADO por tools/vendor_policies.py desde curation/rules.yaml. No editar a mano.
# SEC-003 · Sin montar el token de la ServiceAccount por defecto
# Origen: kyverno/policies@ec478cb59963 other-vpol/restrict-sa-automount-sa-token/restrict-sa-automount-sa-token.yaml (Apache-2.0).
# Lógica de Kyverno sin cambios; añadidos: ID, categoría, textos, marcos de referencia, modo Audit.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-sa-automount-sa-token
  annotations:
    policies.kyverno.io/title: Restrict Auto-Mount of Service Account Tokens in Service Account in ValidatingPolicy
    policies.kyverno.io/category: Security in vpol
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: '1.30'
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Secret,ServiceAccount
    policies.kyverno.io/description: 'Kubernetes automatically mounts ServiceAccount credentials in each
      ServiceAccount. The ServiceAccount may be assigned roles allowing Pods to access API resources.
      Blocking this ability is an extension of the least privilege best practice and should be followed
      if Pods do not need to speak to the API server to function. This policy ensures that mounting of
      these ServiceAccount tokens is blocked.      '
    security.labjp.xyz/rule-id: SEC-003
    security.labjp.xyz/title: Sin montar el token de la ServiceAccount por defecto
    security.labjp.xyz/rationale: Con el montaje automático, cualquier pod de la ServiceAccount lleva
      un token del API server aunque no lo use; si el pod cae, el token sirve para moverse por el clúster.
      Que lo pida solo el pod que lo necesita, en su propia especificación.
    security.labjp.xyz/remediation: |
      apiVersion: v1
      kind: ServiceAccount
      automountServiceAccountToken: false   # el pod que lo necesite lo activa en su spec
    security.labjp.xyz/origin: kyverno-library
    security.labjp.xyz/upstream: https://github.com/kyverno/policies/blob/ec478cb5996376c0d2f09520675805a8e33297c9/other-vpol/restrict-sa-automount-sa-token/restrict-sa-automount-sa-token.yaml
    security.labjp.xyz/owasp-k8s-2025: K02, K03
    security.labjp.xyz/owasp-mcp-2025: MCP01
    security.labjp.xyz/pci-dss-4.0.1: '7'
  labels:
    security.labjp.xyz/standard: homelab-baseline
    security.labjp.xyz/category: secrets
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - serviceaccounts
  validations:
  - expression: object.?automountServiceAccountToken.orValue(true) == false
    message: '[SEC-003] ServiceAccounts must set automountServiceAccountToken to false.'
