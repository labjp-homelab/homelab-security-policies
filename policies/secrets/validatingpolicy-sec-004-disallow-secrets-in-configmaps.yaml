# GENERADO por tools/vendor_policies.py desde curation.yaml. No editar a mano.
# SEC-004 · Sin secretos en ConfigMaps
# Origen: regla propia del homelab, custom/disallow-secrets-in-configmaps.yaml.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-secrets-in-configmaps
  annotations:
    policies.kyverno.io/title: Disallow Secrets in ConfigMaps
    policies.kyverno.io/category: Other
    policies.kyverno.io/subject: ConfigMap
    policies.kyverno.io/description: ConfigMaps are not encrypted nor access-restricted like Secrets.
      Keys that name a credential, and values holding a private key, belong in a Secret.
    policies.kyverno.io/severity: high
    security.labjp.xyz/rule-id: SEC-004
    security.labjp.xyz/title: Sin secretos en ConfigMaps
    security.labjp.xyz/rationale: 'Un ConfigMap no se protege como un Secret: lo leen más roles y aparece
      en los diffs de Argo CD. Una clave que nombra una credencial o un valor con una clave privada es
      un secreto mal guardado.'
    security.labjp.xyz/remediation: |
      # Guardarlo en OpenBao y traerlo con un ExternalSecret
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
    security.labjp.xyz/origin: homelab
    security.labjp.xyz/upstream: https://github.com/labjp-homelab/homelab-security-policies/blob/main/custom/disallow-secrets-in-configmaps.yaml
    security.labjp.xyz/owasp-k8s-2025: K03
    security.labjp.xyz/owasp-mcp-2025: MCP01
    security.labjp.xyz/pci-dss-4.0.1: '3'
  labels:
    security.labjp.xyz/standard: homelab-baseline
    security.labjp.xyz/category: secrets
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - configmaps
  variables:
  - name: data
    expression: object.?data.orValue({})
  validations:
  - expression: |-
      !variables.data.exists(k,
        k.matches('(?i)(passw|secret|token|api[-_]?key|private[-_]?key|credential)'))
    message: '[SEC-004] ConfigMap keys must not name a credential (password, secret, token, API key);
      use a Secret.'
  - expression: '!variables.data.exists(k, variables.data[k].contains(''PRIVATE KEY-----''))'
    message: '[SEC-004] ConfigMaps must not hold private keys; use a Secret.'
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
