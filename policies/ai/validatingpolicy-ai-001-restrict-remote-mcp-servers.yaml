# GENERADO por tools/vendor_policies.py desde curation.yaml. No editar a mano.
# AI-001 · Servidores MCP solo por la pasarela de agentes
# Origen: regla propia del homelab, custom/restrict-remote-mcp-servers.yaml.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-remote-mcp-servers
  annotations:
    policies.kyverno.io/title: Restrict remote MCP servers to approved endpoints
    policies.kyverno.io/category: Other
    policies.kyverno.io/subject: RemoteMCPServer
    policies.kyverno.io/description: Agents may only use MCP servers reached through the agent gateway
      or kagent's own tool server.
    policies.kyverno.io/severity: high
    security.labjp.xyz/rule-id: AI-001
    security.labjp.xyz/title: Servidores MCP solo por la pasarela de agentes
    security.labjp.xyz/rationale: 'Un RemoteMCPServer que apunta fuera de agentgateway se salta su JWT,
      sus límites y el registro del MCP Gateway: es un servidor MCP en la sombra.'
    security.labjp.xyz/remediation: |
      spec:
        url: http://agentgateway-proxy.agentgateway-system.svc.cluster.local/mcp
    security.labjp.xyz/origin: homelab
    security.labjp.xyz/upstream: https://github.com/labjp-homelab/homelab-security-policies/blob/main/custom/restrict-remote-mcp-servers.yaml
    security.labjp.xyz/owasp-mcp-2025: MCP09, MCP07
    security.labjp.xyz/owasp-llm-2025: LLM06
  labels:
    security.labjp.xyz/standard: homelab-baseline
    security.labjp.xyz/category: ai
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - kagent.dev
      apiVersions:
      - v1alpha2
      operations:
      - CREATE
      - UPDATE
      resources:
      - remotemcpservers
  variables:
  - name: approvedHosts
    expression: '[''agentgateway-proxy.agentgateway-system.svc.cluster.local'', ''kagent-tools.kagent'']'
  - name: host
    expression: object.spec.?url.orValue('').replace('https://', '').replace('http://', '').split('/')[0].split(':')[0]
  validations:
  - expression: variables.host in variables.approvedHosts
    messageExpression: '''[AI-001] '' + ''MCP server '' + object.metadata.name + '' points to '' + variables.host
      + '', which is not an approved endpoint'''
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
