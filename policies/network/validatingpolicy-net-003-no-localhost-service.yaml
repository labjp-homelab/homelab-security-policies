# GENERADO por tools/vendor_policies.py desde curation.yaml. No editar a mano.
# NET-003 · Sin Services ExternalName a localhost
# Origen: kyverno/policies@ec478cb59963 other-vpol/disallow-localhost-services/disallow-localhost-services.yaml (Apache-2.0).
# Lógica de Kyverno sin cambios; añadidos: ID, categoría, textos, marcos de referencia, modo Audit.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: no-localhost-service
  annotations:
    policies.kyverno.io/title: Disallow Localhost ExternalName Services in ValidatingPolicy
    policies.kyverno.io/category: Sample in Vpol
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Service
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: '1.30'
    policies.kyverno.io/description: A Service of type ExternalName which points back to localhost can
      potentially be used to exploit vulnerabilities in some Ingress controllers. This policy audits Services
      of type ExternalName if the externalName field refers to localhost.
    security.labjp.xyz/rule-id: NET-003
    security.labjp.xyz/title: Sin Services ExternalName a localhost
    security.labjp.xyz/rationale: Un ExternalName hacia localhost hace que el proxy del clúster apunte
      a servicios locales del nodo.
    security.labjp.xyz/remediation: |
      # No usar type: ExternalName con externalName: localhost
    security.labjp.xyz/origin: kyverno-library
    security.labjp.xyz/upstream: https://github.com/kyverno/policies/blob/ec478cb5996376c0d2f09520675805a8e33297c9/other-vpol/disallow-localhost-services/disallow-localhost-services.yaml
    security.labjp.xyz/owasp-k8s-2025: K05
    security.labjp.xyz/pci-dss-4.0.1: '1'
  labels:
    security.labjp.xyz/standard: homelab-baseline
    security.labjp.xyz/category: network
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - services
  validations:
  - expression: object.spec.type != 'ExternalName' || object.spec.externalName != 'localhost'
    message: '[NET-003] Service of type ExternalName cannot point to localhost.'
