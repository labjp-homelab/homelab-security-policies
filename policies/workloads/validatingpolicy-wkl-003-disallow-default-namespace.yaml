# WKL-003 · Nada en el namespace default
# Origen: kyverno/policies@ec478cb59963 best-practices-vpol/disallow-default-namespace/disallow-default-namespace.yaml (Apache-2.0).
# Lógica de Kyverno sin cambios; añadidos: ID, categoría, textos, marcos de referencia, modo Audit.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-default-namespace
  annotations:
    policies.kyverno.io/title: Disallow Default Namespace in VPOL
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/category: Multi-Tenancy in VPOL
    kyverno.io/kubernetes-version: '1.30'
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Kubernetes Namespaces are an optional feature that provide a way
      to segment and isolate cluster resources across multiple applications and users. As a best practice,
      workloads should be isolated with Namespaces. Namespaces should be required and the default (empty)
      Namespace should not be used. This policy validates that Pods specify a Namespace name other than
      `default`. Rule auto-generation is disabled here due to Pod controllers need to specify the `namespace`
      field under the top-level `metadata` object and not at the Pod template level.
    security.labjp.xyz/rule-id: WKL-003
    security.labjp.xyz/title: Nada en el namespace default
    security.labjp.xyz/rationale: 'El namespace default no tiene cuotas, límites ni NetworkPolicies propias:
      lo que cae ahí queda fuera de la gobernanza.'
    security.labjp.xyz/remediation: |
      metadata:
        namespace: <namespace propio, declarado en la gobernanza>
    security.labjp.xyz/upstream: https://github.com/kyverno/policies/blob/ec478cb5996376c0d2f09520675805a8e33297c9/best-practices-vpol/disallow-default-namespace/disallow-default-namespace.yaml
    security.labjp.xyz/owasp-k8s-2025: K01
  labels:
    security.labjp.xyz/standard: homelab-baseline
    security.labjp.xyz/category: workloads
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: namespaceObject.metadata.name != 'default'
    message: '[WKL-003] Using ''default'' namespace is not allowed.'
