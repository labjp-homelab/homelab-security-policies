# GENERADO por tools/vendor_policies.py desde curation/rules.yaml. No editar a mano.
# RBAC-005 · Sin verbos comodín en roles
# Origen: kyverno/policies@ec478cb59963 other-vpol/restrict-wildcard-verbs/restrict-wildcard-verbs.yaml (Apache-2.0).
# Lógica de Kyverno sin cambios; añadidos: ID, categoría, textos, marcos de referencia, modo Audit.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-wildcard-verbs
  annotations:
    policies.kyverno.io/title: Restrict Wildcard in Verbs in ValidatingPolicy
    policies.kyverno.io/category: Security, EKS Best Practices in vpol
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Role, ClusterRole, RBAC
    kyverno.io/kyverno-version: 1.14.0
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: '1.30'
    policies.kyverno.io/description: Wildcards ('*') in verbs grants all access to the resources referenced
      by it and does not follow the principal of least privilege. As much as possible, avoid such open
      verbs unless scoped to perhaps a custom API group. This policy blocks any Role or ClusterRole that
      contains a wildcard entry in the verbs list found in any rule.
    security.labjp.xyz/rule-id: RBAC-005
    security.labjp.xyz/title: Sin verbos comodín en roles
    security.labjp.xyz/rationale: 'Un verbo ''*'' concede hoy todo lo que la API permite y mañana lo que
      añada: el rol deja de describir lo que de verdad necesita quien lo usa.'
    security.labjp.xyz/remediation: |
      rules:
        - apiGroups: [""]
          resources: [pods]
          verbs: [get, list, watch]   # los verbos concretos, nunca "*"
    security.labjp.xyz/origin: kyverno-library
    security.labjp.xyz/upstream: https://github.com/kyverno/policies/blob/ec478cb5996376c0d2f09520675805a8e33297c9/other-vpol/restrict-wildcard-verbs/restrict-wildcard-verbs.yaml
    security.labjp.xyz/owasp-k8s-2025: K02
    security.labjp.xyz/owasp-mcp-2025: MCP02
    security.labjp.xyz/pci-dss-4.0.1: '7'
  labels:
    security.labjp.xyz/standard: homelab-baseline
    security.labjp.xyz/category: rbac
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - rbac.authorization.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - roles
      - clusterroles
  validations:
  - expression: object.rules == null || !object.rules.exists(rule, '*' in rule.verbs)
    message: '[RBAC-005] Use of a wildcard (''*'') in any verbs is forbidden.'
