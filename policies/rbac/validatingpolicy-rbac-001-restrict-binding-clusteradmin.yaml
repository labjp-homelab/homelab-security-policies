# GENERADO por tools/vendor_policies.py desde curation.yaml. No editar a mano.
# RBAC-001 · Sin enlaces a cluster-admin
# Origen: kyverno/policies@ec478cb59963 other-vpol/restrict-binding-clusteradmin/restrict-binding-clusteradmin.yaml (Apache-2.0).
# Lógica de Kyverno sin cambios; añadidos: ID, categoría, textos, marcos de referencia, modo Audit.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-binding-clusteradmin
  annotations:
    policies.kyverno.io/title: Restrict Binding to Cluster-Admin in ValidatingPolicy
    policies.kyverno.io/category: Security in vpol
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: RoleBinding, ClusterRoleBinding, RBAC
    kyverno.io/kyverno-version: 1.14.0
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: '1.30'
    policies.kyverno.io/description: The cluster-admin ClusterRole allows any action to be performed on
      any resource in the cluster and its granting should be heavily restricted. This policy prevents
      binding to the cluster-admin ClusterRole in RoleBinding or ClusterRoleBinding resources.
    security.labjp.xyz/rule-id: RBAC-001
    security.labjp.xyz/title: Sin enlaces a cluster-admin
    security.labjp.xyz/rationale: cluster-admin permite cualquier acción sobre cualquier recurso. Ninguna
      aplicación ni agente debe tenerlo; cada uno, su Role mínimo.
    security.labjp.xyz/remediation: |
      roleRef:
        kind: ClusterRole
        name: <rol mínimo propio>   # nunca cluster-admin
    security.labjp.xyz/origin: kyverno-library
    security.labjp.xyz/upstream: https://github.com/kyverno/policies/blob/ec478cb5996376c0d2f09520675805a8e33297c9/other-vpol/restrict-binding-clusteradmin/restrict-binding-clusteradmin.yaml
    security.labjp.xyz/owasp-k8s-2025: K02
    security.labjp.xyz/owasp-mcp-2025: MCP02
    security.labjp.xyz/pci-dss-4.0.1: '7'
  labels:
    security.labjp.xyz/standard: homelab-baseline
    security.labjp.xyz/category: rbac
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - rbac.authorization.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - rolebindings
      - clusterrolebindings
  validations:
  - expression: object.roleRef.name != 'cluster-admin'
    message: '[RBAC-001] Binding to cluster-admin is not allowed.'
