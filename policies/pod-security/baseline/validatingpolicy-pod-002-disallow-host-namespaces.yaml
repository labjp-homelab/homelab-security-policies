# GENERADO por tools/vendor_policies.py desde curation/rules.yaml. No editar a mano.
# POD-002 · Sin namespaces del nodo
# Origen: kyverno/policies@ec478cb59963 pod-security-vpol/baseline/disallow-host-namespaces/disallow-host-namespaces.yaml (Apache-2.0).
# Lógica de Kyverno sin cambios; añadidos: ID, categoría, textos, marcos de referencia, modo Audit.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-namespaces
  annotations:
    policies.kyverno.io/title: Disallow Host Namespaces in ValidatingPolicy
    policies.kyverno.io/category: Pod Security Standards (Baseline) in ValidatingPolicy
    policies.kyverno.io/severity: high
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: 1.30+
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Host namespaces (Process ID namespace, Inter-Process Communication
      namespace, and network namespace) allow access to shared information and can be used to elevate
      privileges. Pods should not be allowed access to host namespaces. This policy ensures fields which
      make use of these host namespaces are unset or set to `false`.
    security.labjp.xyz/rule-id: POD-002
    security.labjp.xyz/title: Sin namespaces del nodo
    security.labjp.xyz/rationale: 'Con hostNetwork, hostPID o hostIPC el pod comparte la red, los procesos
      o la memoria compartida del nodo: puede espiar tráfico, ver procesos de otros pods o atacarlos.'
    security.labjp.xyz/remediation: |
      spec:
        hostNetwork: false
        hostPID: false
        hostIPC: false
    security.labjp.xyz/origin: kyverno-library
    security.labjp.xyz/upstream: https://github.com/kyverno/policies/blob/ec478cb5996376c0d2f09520675805a8e33297c9/pod-security-vpol/baseline/disallow-host-namespaces/disallow-host-namespaces.yaml
    security.labjp.xyz/owasp-k8s-2025: K01
    security.labjp.xyz/pci-dss-4.0.1: '2'
  labels:
    security.labjp.xyz/standard: homelab-baseline
    security.labjp.xyz/category: pod-security-baseline
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: hostNetwork
    expression: object.spec.?hostNetwork.orValue(false)
  - name: hostIPC
    expression: object.spec.?hostIPC.orValue(false)
  - name: hostPID
    expression: object.spec.?hostPID.orValue(false)
  validations:
  - expression: '!(variables.hostNetwork || variables.hostIPC || variables.hostPID)'
    message: '[POD-002] Sharing the host namespaces is disallowed. The fields spec.hostNetwork, spec.hostIPC,
      and spec.hostPID must be unset or set to `false`.'
