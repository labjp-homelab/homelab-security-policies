# GENERADO por tools/vendor_policies.py desde curation.yaml. No editar a mano.
# POD-009 · Perfil seccomp no deshabilitado
# Origen: kyverno/policies@ec478cb59963 pod-security-vpol/baseline/restrict-seccomp/restrict-seccomp.yaml (Apache-2.0).
# Lógica de Kyverno sin cambios; añadidos: ID, categoría, textos, marcos de referencia, modo Audit.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-seccomp
  annotations:
    policies.kyverno.io/title: Restrict Seccomp in ValidatingPolicy
    policies.kyverno.io/category: Pod Security Standards (Baseline) in ValidatingPolicy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: 1.30+
    policies.kyverno.io/description: The seccomp profile must not be explicitly set to Unconfined. This
      policy,  requiring Kubernetes v1.30 or later, ensures that seccomp is unset or  set to `RuntimeDefault`
      or `Localhost`.
    security.labjp.xyz/rule-id: POD-009
    security.labjp.xyz/title: Perfil seccomp no deshabilitado
    security.labjp.xyz/rationale: seccomp Unconfined deja al contenedor invocar cualquier syscall del
      kernel, incluidas las que usan los exploits de escape.
    security.labjp.xyz/remediation: |
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    security.labjp.xyz/upstream: https://github.com/kyverno/policies/blob/ec478cb5996376c0d2f09520675805a8e33297c9/pod-security-vpol/baseline/restrict-seccomp/restrict-seccomp.yaml
    security.labjp.xyz/owasp-k8s-2025: K01
    security.labjp.xyz/pci-dss-4.0.1: '2'
  labels:
    security.labjp.xyz/standard: homelab-baseline
    security.labjp.xyz/category: pod-security-baseline
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: allContainers
    expression: object.spec.containers +  object.spec.?initContainers.orValue([]) +  object.spec.?ephemeralContainers.orValue([])
  - name: allowedProfileTypes
    expression: '[''RuntimeDefault'', ''Localhost'']'
  - name: hasValidSeccompProfile
    expression: object.spec.?securityContext.?seccompProfile.?type.orValue('Localhost') in variables.allowedProfileTypes
  validations:
  - expression: "variables.hasValidSeccompProfile && variables.allContainers.all(container, \n  container.?securityContext.?seccompProfile.?type.orValue('Localhost')\
      \ in variables.allowedProfileTypes)"
    message: '[POD-009] Use of custom Seccomp profiles is disallowed. The field `securityContext.seccompProfile.type`
      must be unset or set to `RuntimeDefault` or `Localhost`.'
