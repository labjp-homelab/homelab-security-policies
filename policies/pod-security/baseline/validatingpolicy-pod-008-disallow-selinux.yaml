# GENERADO por tools/vendor_policies.py desde curation.yaml. No editar a mano.
# POD-008 · Sin opciones SELinux personalizadas
# Origen: kyverno/policies@ec478cb59963 pod-security-vpol/baseline/disallow-selinux/disallow-selinux.yaml (Apache-2.0).
# Lógica de Kyverno sin cambios; añadidos: ID, categoría, textos, marcos de referencia, modo Audit.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-selinux
  annotations:
    policies.kyverno.io/title: Disallow SELinux in ValidatingPolicy
    policies.kyverno.io/category: Pod Security Standards (Baseline) in ValidatingPolicy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: 1.30+
    policies.kyverno.io/description: SELinux options can be used to escalate privileges and should not
      be allowed. This policy ensures that the `seLinuxOptions` field is undefined.
    security.labjp.xyz/rule-id: POD-008
    security.labjp.xyz/title: Sin opciones SELinux personalizadas
    security.labjp.xyz/rationale: Cambiar el usuario, rol o tipo SELinux puede quitar al contenedor el
      confinamiento que le aplica el runtime.
    security.labjp.xyz/remediation: |
      # No declarar seLinuxOptions, o solo el tipo container_t / container_init_t / container_kvm_t
    security.labjp.xyz/origin: kyverno-library
    security.labjp.xyz/upstream: https://github.com/kyverno/policies/blob/ec478cb5996376c0d2f09520675805a8e33297c9/pod-security-vpol/baseline/disallow-selinux/disallow-selinux.yaml
    security.labjp.xyz/owasp-k8s-2025: K01
    security.labjp.xyz/pci-dss-4.0.1: '2'
  labels:
    security.labjp.xyz/standard: homelab-baseline
    security.labjp.xyz/category: pod-security-baseline
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: allContainerTypes
    expression: object.spec.containers +  object.spec.?initContainers.orValue([]) +  object.spec.?ephemeralContainers.orValue([])
  - name: seLinuxTypes
    expression: '[''container_t'', ''container_init_t'', ''container_kvm_t'']'
  - name: hasValidSELinuxType
    expression: object.spec.?securityContext.?seLinuxOptions.?type.orValue('') == '' ||  variables.seLinuxTypes.exists(type,
      type == object.spec.securityContext.seLinuxOptions.type)
  - name: hasValidSELinuxUserRole
    expression: object.spec.?securityContext.?seLinuxOptions.?user.orValue('') == '' && object.spec.?securityContext.?seLinuxOptions.?role.orValue('')
      == ''
  validations:
  - expression: "variables.hasValidSELinuxType && variables.allContainerTypes.all(container, \n  container.?securityContext.?seLinuxOptions.?type.orValue('')\
      \ == '' || \n  variables.seLinuxTypes.exists(type, type == container.securityContext.seLinuxOptions.type))"
    message: '[POD-008] Setting the SELinux type is restricted. The field securityContext.seLinuxOptions.type
      must either be unset or set to one of the allowed values (container_t, container_init_t, or container_kvm_t).'
  - expression: |-
      variables.hasValidSELinuxUserRole && variables.allContainerTypes.all(container,
        container.?securityContext.?seLinuxOptions.?user.orValue('') == '' &&
        container.?securityContext.?seLinuxOptions.?role.orValue('') == '')
    message: '[POD-008] Setting the SELinux user or role is forbidden. The fields seLinuxOptions.user
      and seLinuxOptions.role must be unset.'
