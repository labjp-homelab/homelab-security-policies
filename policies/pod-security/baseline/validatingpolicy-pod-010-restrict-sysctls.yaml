# GENERADO por tools/vendor_policies.py desde curation.yaml. No editar a mano.
# POD-010 · Solo sysctls seguros
# Origen: kyverno/policies@ec478cb59963 pod-security-vpol/baseline/restrict-sysctls/restrict-sysctls.yaml (Apache-2.0).
# Lógica de Kyverno sin cambios; añadidos: ID, categoría, textos, marcos de referencia, modo Audit.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-sysctls
  annotations:
    policies.kyverno.io/title: Restrict sysctls in ValidatingPolicy
    policies.kyverno.io/category: Pod Security Standards (Baseline) in ValidatingPolicy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: 1.30+
    policies.kyverno.io/description: Sysctls can disable security mechanisms or affect all containers
      on a host, and should be disallowed except for an allowed "safe" subset. A sysctl is considered
      safe if it is namespaced in the container or the Pod, and it is isolated from other Pods or processes
      on the same Node. This policy ensures that only those "safe" subsets can be specified in a Pod.
    security.labjp.xyz/rule-id: POD-010
    security.labjp.xyz/title: Solo sysctls seguros
    security.labjp.xyz/rationale: Los sysctls fuera del conjunto seguro cambian parámetros del kernel
      que afectan a todos los pods del nodo.
    security.labjp.xyz/remediation: |
      # Solo: kernel.shm_rmid_forced, net.ipv4.ip_local_port_range,
      # net.ipv4.ip_unprivileged_port_start, net.ipv4.tcp_syncookies, net.ipv4.ping_group_range
    security.labjp.xyz/origin: kyverno-library
    security.labjp.xyz/upstream: https://github.com/kyverno/policies/blob/ec478cb5996376c0d2f09520675805a8e33297c9/pod-security-vpol/baseline/restrict-sysctls/restrict-sysctls.yaml
    security.labjp.xyz/owasp-k8s-2025: K01
    security.labjp.xyz/pci-dss-4.0.1: '2'
  labels:
    security.labjp.xyz/standard: homelab-baseline
    security.labjp.xyz/category: pod-security-baseline
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: allowedSysctls
    expression: '[''kernel.shm_rmid_forced'',''net.ipv4.ip_local_port_range'',''net.ipv4.ip_unprivileged_port_start'',''net.ipv4.tcp_syncookies'',''net.ipv4.ping_group_range'']'
  validations:
  - expression: "object.spec.?securityContext.?sysctls.orValue([]).all(sysctl, \n  sysctl.?name.orValue('')\
      \ in variables.allowedSysctls)"
    message: '[POD-010] Setting additional sysctls above the allowed type is disallowed. The field spec.securityContext.sysctls
      must be unset or not use any other names than kernel.shm_rmid_forced, net.ipv4.ip_local_port_range,
      net.ipv4.ip_unprivileged_port_start, net.ipv4.tcp_syncookies and net.ipv4.ping_group_range.'
