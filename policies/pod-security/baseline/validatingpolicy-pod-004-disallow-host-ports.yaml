# GENERADO por tools/vendor_policies.py desde curation.yaml. No editar a mano.
# POD-004 · Sin puertos del nodo
# Origen: kyverno/policies@ec478cb59963 pod-security-vpol/baseline/disallow-host-ports/disallow-host-ports.yaml (Apache-2.0).
# Lógica de Kyverno sin cambios; añadidos: ID, categoría, textos, marcos de referencia, modo Audit.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-ports
  annotations:
    policies.kyverno.io/title: Disallow hostPorts in ValidatingPolicy
    policies.kyverno.io/category: Pod Security Standards (Baseline) in ValidatingPolicy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: 1.30+
    policies.kyverno.io/description: 'Access to host ports allows potential snooping of network traffic
      and should not be allowed, or at minimum restricted to a known list. This policy ensures the `hostPort`
      field is unset or set to `0`. '
    security.labjp.xyz/rule-id: POD-004
    security.labjp.xyz/title: Sin puertos del nodo
    security.labjp.xyz/rationale: hostPort publica el contenedor directamente en la IP del nodo, saltándose
      Services, NetworkPolicies y el Gateway.
    security.labjp.xyz/remediation: |
      ports:
        - containerPort: 8080   # sin hostPort; exponer con un Service
    security.labjp.xyz/upstream: https://github.com/kyverno/policies/blob/ec478cb5996376c0d2f09520675805a8e33297c9/pod-security-vpol/baseline/disallow-host-ports/disallow-host-ports.yaml
    security.labjp.xyz/owasp-k8s-2025: K01
    security.labjp.xyz/pci-dss-4.0.1: '2'
  labels:
    security.labjp.xyz/standard: homelab-baseline
    security.labjp.xyz/category: pod-security-baseline
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: allContainers
    expression: "object.spec.containers + \n object.spec.?initContainers.orValue([]) + \n object.spec.?ephemeralContainers.orValue([])"
  validations:
  - expression: "variables.allContainers.all(container, \n  container.?ports.orValue([]).all(port, port.?hostPort.orValue(0)\
      \ == 0))"
    message: '[POD-004] Use of host ports is disallowed. The field spec.containers[*].ports[*].hostPort
      must either be unset or set to `0`.'
