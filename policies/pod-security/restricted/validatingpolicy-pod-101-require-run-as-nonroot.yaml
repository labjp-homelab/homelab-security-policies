# GENERADO por tools/vendor_policies.py desde curation.yaml. No editar a mano.
# POD-101 · Los contenedores no corren como root
# Origen: kyverno/policies@ec478cb59963 pod-security-vpol/restricted/require-run-as-nonroot/require-run-as-nonroot.yaml (Apache-2.0).
# Lógica de Kyverno sin cambios; añadidos: ID, categoría, textos, marcos de referencia, modo Audit.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-run-as-nonroot
  annotations:
    policies.kyverno.io/title: Require runAsNonRoot in ValidatingPolicy
    policies.kyverno.io/category: Pod Security Standards (Restricted) in ValidatingPolicy
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: 1.30+
    policies.kyverno.io/description: Containers must be required to run as non-root. This policy ensures
      `runAsNonRoot` is set to true.
    security.labjp.xyz/rule-id: POD-101
    security.labjp.xyz/title: Los contenedores no corren como root
    security.labjp.xyz/rationale: 'Con runAsNonRoot el kubelet se niega a arrancar una imagen que corra
      como root: un proceso con uid 0 está a una vulnerabilidad del kernel de ser root en el nodo.'
    security.labjp.xyz/remediation: |
      securityContext:
        runAsNonRoot: true
    security.labjp.xyz/upstream: https://github.com/kyverno/policies/blob/ec478cb5996376c0d2f09520675805a8e33297c9/pod-security-vpol/restricted/require-run-as-nonroot/require-run-as-nonroot.yaml
    security.labjp.xyz/owasp-k8s-2025: K01
    security.labjp.xyz/pci-dss-4.0.1: '2'
  labels:
    security.labjp.xyz/standard: homelab-baseline
    security.labjp.xyz/category: pod-security-restricted
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: ctnrs
    expression: object.spec.containers +  object.spec.?initContainers.orValue([]) +  object.spec.?ephemeralContainers.orValue([])
  validations:
  - expression: |-
      (object.spec.?securityContext.?runAsNonRoot.orValue(false) == true
        && variables.ctnrs.all(c, c.?securityContext.?runAsNonRoot.orValue(true) == true))
        || variables.ctnrs.all(c, c.?securityContext.?runAsNonRoot.orValue(false) == true)
    message: '[POD-101] Running as root is not allowed. Either spec.securityContext.runAsNonRoot must
      be set to true, or all containers (spec.containers[*], spec.initContainers[*], spec.ephemeralContainers[*])
      must have securityContext.runAsNonRoot set to true.'
