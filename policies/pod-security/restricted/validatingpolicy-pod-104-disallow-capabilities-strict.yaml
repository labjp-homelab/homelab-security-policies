# GENERADO por tools/vendor_policies.py desde curation/rules.yaml. No editar a mano.
# POD-104 · Sin capabilities (salvo NET_BIND_SERVICE)
# Origen: kyverno/policies@ec478cb59963 pod-security-vpol/restricted/disallow-capabilities-strict/disallow-capabilities-strict.yaml (Apache-2.0).
# Lógica de Kyverno sin cambios; añadidos: ID, categoría, textos, marcos de referencia, modo Audit.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-capabilities-strict
  annotations:
    policies.kyverno.io/title: Disallow Capabilities (Strict) in ValidatingPolicy
    policies.kyverno.io/category: Pod Security Standards (Restricted) in ValidatingPolicy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: 1.30+
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Adding capabilities other than `NET_BIND_SERVICE` is disallowed.
      In addition, all containers must explicitly drop `ALL` capabilities.
    security.labjp.xyz/rule-id: POD-104
    security.labjp.xyz/title: Sin capabilities (salvo NET_BIND_SERVICE)
    security.labjp.xyz/rationale: 'Se quitan todas las capabilities y como mucho se añade NET_BIND_SERVICE:
      el runtime concede por defecto otras (NET_RAW, CHOWN) que casi ninguna aplicación necesita.'
    security.labjp.xyz/remediation: |
      securityContext:
        capabilities:
          drop: ["ALL"]
    security.labjp.xyz/origin: kyverno-library
    security.labjp.xyz/upstream: https://github.com/kyverno/policies/blob/ec478cb5996376c0d2f09520675805a8e33297c9/pod-security-vpol/restricted/disallow-capabilities-strict/disallow-capabilities-strict.yaml
    security.labjp.xyz/owasp-k8s-2025: K01
    security.labjp.xyz/pci-dss-4.0.1: '2'
  labels:
    security.labjp.xyz/standard: homelab-baseline
    security.labjp.xyz/category: pod-security-restricted
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: allContainers
    expression: object.spec.containers +  (object.spec.?initContainers.orValue([])) +  (object.spec.?ephemeralContainers.orValue([]))
  validations:
  - expression: variables.allContainers.all(container,  container.?securityContext.?capabilities.?drop.orValue([]).exists_one(capability,
      capability == 'ALL'))
    message: '[POD-104] Containers must drop `ALL` capabilities.'
  - expression: "variables.allContainers.all(container, \n  container.?securityContext.?capabilities.?add.orValue([]).size()\
      \ == 0 || \n  (container.securityContext.capabilities.add.orValue([]).size() == 1 && \n  container.securityContext.capabilities.add[0]\
      \ == 'NET_BIND_SERVICE'))"
    message: '[POD-104] Any capabilities added other than NET_BIND_SERVICE are disallowed.'
