# OWASP MCP Top 10, versión 2025 (escrito a mano). Formato y estados: ver
# owasp-k8s-2025.yaml. El proyecto está en BETA (v0.1): los títulos pueden cambiar.
# Aplica a agentgateway (la única fachada MCP del homelab) y a los servidores MCP.
id: owasp-mcp-2025
title: OWASP MCP Top 10
edition: "2025 (v0.1, beta)"
url: https://owasp.github.io/www-project-mcp-top-10/
items:
  - id: MCP01
    title: Token Mismanagement & Secret Exposure
    status: parcial
    homelab:
      - Tokens de corta duración emitidos por Keycloak; secretos en OpenBao vía External Secrets
  - id: MCP02
    title: Privilege Escalation via Scope Creep
    status: parcial
    homelab:
      - Un rol mcp:tool:<destino>_<herramienta> por herramienta en Keycloak, que agentgateway exige en cada tools/call (homelab-gitops, components/platform/agentgateway-config/policy-mcp-backend.yaml)
  - id: MCP03
    title: Tool Poisoning
    status: pendiente
    homelab:
      - La demo de Black Alpaca lo muestra; no hay control en el homelab
  - id: MCP04
    title: Software Supply Chain Attacks & Dependency Tampering
    status: parcial
    homelab:
      - Imágenes firmadas con Tekton Chains y servidas desde Zot
  - id: MCP05
    title: Command Injection & Execution
    status: pendiente
    homelab:
      - Pendiente validar la entrada en cada servidor MCP; las reglas de pods solo acotan el daño
  - id: MCP06
    title: Intent Flow Subversion
    status: parcial
    homelab:
      - Solo en la demo de Black Alpaca, sesión 2 (aprobación humana antes de actuar)
  - id: MCP07
    title: Insufficient Authentication & Authorization
    status: parcial
    homelab:
      - JWT de Keycloak en la entrada de agentgateway y autorización por herramienta (policy-jwt.yaml, policy-mcp-backend.yaml)
      - Pendiente validar el flujo de punta a punta agente → agentgateway → servidor MCP
  - id: MCP08
    title: Lack of Audit and Telemetry
    status: parcial
    homelab:
      - Métricas en Prometheus; pendiente la traza de punta a punta de cada llamada a herramienta
  - id: MCP09
    title: Shadow MCP Servers
    status: parcial
    homelab:
      - Los servidores solo se federan en agentgateway (homelab-gitops, components/platform/agentgateway-config/backend-mcp.yaml)
  - id: MCP10
    title: Context Injection & Over-Sharing
    status: pendiente
    homelab: []
