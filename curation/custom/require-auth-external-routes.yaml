# Regla propia del homelab. La capa común la añade tools/vendor_policies.py desde
# curation/rules.yaml.
#
# Una ruta del Gateway `externo` (Internet, por el túnel) debe tener login: una
# SecurityPolicy de Envoy Gateway (OIDC) o una AuthPolicy de Kuadrant que la apunte en su
# namespace. Si es pública a propósito (la portada, webhooks firmados, la página de estado),
# lo declara con la anotación security.labjp.xyz/public y el motivo.
#
# Las variables de CEL se evalúan solo si hacen falta: la consulta a otros objetos
# (resource.List) solo ocurre en rutas externas sin la anotación.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-auth-external-routes
  annotations:
    policies.kyverno.io/title: Require authentication on external routes
    policies.kyverno.io/category: Other
    policies.kyverno.io/subject: HTTPRoute, SecurityPolicy, AuthPolicy
    policies.kyverno.io/description: >-
      Every HTTPRoute attached to the external Gateway needs an authentication policy, or an
      explicit annotation stating why it is public.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [gateway.networking.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [httproutes]
  variables:
    - name: external
      expression: "object.spec.?parentRefs.orValue([]).exists(p, p.name == 'externo')"
    - name: public
      expression: "object.metadata.?annotations[?'security.labjp.xyz/public'].orValue('') != ''"
    - name: authPolicies
      expression: >-
        resource.List('gateway.envoyproxy.io/v1alpha1', 'securitypolicies', object.metadata.namespace).items +
        resource.List('kuadrant.io/v1', 'authpolicies', object.metadata.namespace).items
    - name: protected
      expression: >-
        variables.authPolicies.exists(p,
          p.spec.?targetRef.?name.orValue('') == object.metadata.name ||
          p.spec.?targetRefs.orValue([]).exists(t, t.name == object.metadata.name))
  validations:
    - expression: "!variables.external || variables.public || variables.protected"
      messageExpression: >-
        'external route ' + object.metadata.name + ' has no SecurityPolicy or AuthPolicy;' +
        ' add one or annotate security.labjp.xyz/public with the reason'
