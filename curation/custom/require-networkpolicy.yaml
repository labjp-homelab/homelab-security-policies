# Regla propia del homelab (no existe como ValidatingPolicy en la biblioteca de Kyverno).
# La capa común la añade tools/vendor_policies.py desde curation/rules.yaml.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-networkpolicy
  annotations:
    policies.kyverno.io/title: Require a NetworkPolicy in the namespace
    policies.kyverno.io/category: Other
    policies.kyverno.io/subject: Pod, NetworkPolicy
    policies.kyverno.io/description: >-
      Without any NetworkPolicy in its namespace a Pod accepts traffic from every Pod in the
      cluster. Each namespace must declare which traffic it allows.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        resource.List('networking.k8s.io/v1', 'networkpolicies', object.metadata.namespace).items.size() > 0
      messageExpression: "'namespace ' + object.metadata.namespace + ' has no NetworkPolicy'"
