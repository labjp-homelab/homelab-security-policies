# Regla propia del homelab (no existe en la biblioteca de Kyverno). La capa común (ID,
# textos, marcos, modo) la añade tools/vendor_policies.py desde curation.yaml.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-secrets-in-configmaps
  annotations:
    policies.kyverno.io/title: Disallow Secrets in ConfigMaps
    policies.kyverno.io/category: Other
    policies.kyverno.io/subject: ConfigMap
    policies.kyverno.io/description: >-
      ConfigMaps are not encrypted nor access-restricted like Secrets. Keys that name a
      credential, and values holding a private key, belong in a Secret.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [configmaps]
  variables:
    - name: data
      expression: "object.?data.orValue({})"
    # Una clave cuenta si nombra una credencial y guarda un valor. No cuentan las que solo
    # referencian un Secret (terminan en name, namespace, ref, path, file o -secret-key,
    # como las de Tekton o KServe) ni las vacías o booleanas.
    - name: credentialKeys
      expression: >-
        variables.data.filter(k,
          k.matches('(?i)(passw|api[-_]?key|private[-_]?key|client[-_]?secret|access[-_]?key|secret[-_]?key|token)') &&
          !k.matches('(?i)(name|namespace|ref|path|file|-secret-key)$') &&
          !(variables.data[k].trim() in ['', 'true', 'false']))
  validations:
    - expression: "variables.credentialKeys.size() == 0"
      messageExpression: >-
        'ConfigMap keys hold credentials (' + variables.credentialKeys.join(', ') + '); use a Secret.'
    - expression: >-
        !variables.data.exists(k, variables.data[k].contains('PRIVATE KEY-----'))
      message: ConfigMaps must not hold private keys; use a Secret.
